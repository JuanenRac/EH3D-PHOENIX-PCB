[workspace]
# the engine crates of the design tool; the model, the readers and the rules join them once their contracts are accepted
members = ["crates/eh3d-phoenix-corpus", "crates/eh3d-phoenix-model", "crates/eh3d-phoenix-project", "crates/eh3d-phoenix-board", "crates/eh3d-phoenix-schematic", "crates/eh3d-phoenix-eagle", "crates/eh3d-phoenix-eagle-board", "crates/eh3d-phoenix-eagle-deep", "crates/eh3d-phoenix-hub", "crates/eh3d-phoenix-export", "crates/eh3d-phoenix-rules", "crates/eh3d-phoenix-erc", "crates/eh3d-phoenix-sync", "crates/eh3d-phoenix-stackup", "crates/eh3d-phoenix-rf", "crates/eh3d-phoenix-rfgen", "crates/eh3d-phoenix-route", "crates/eh3d-phoenix-sim", "crates/eh3d-phoenix-kicad", "crates/eh3d-phoenix-sanitizer", "crates/eh3d-phoenix-script", "crates/eh3d-phoenix-libedit", "crates/eh3d-phoenix-eaglebin", "crates/eh3d-phoenix-schedit", "crates/eh3d-phoenix-viewer", "crates/eh3d-phoenix-zones", "crates/eh3d-phoenix-lengths", "crates/eh3d-phoenix-oracle", "crates/eh3d-phoenix-bom", "crates/eh3d-phoenix-assembly3d", "crates/eh3d-phoenix-gerber", "crates/eh3d-phoenix-panel", "crates/eh3d-phoenix-print", "crates/eh3d-phoenix-boardedit", "crates/eh3d-phoenix-ipclib", "crates/eh3d-phoenix-parts", "crates/eh3d-phoenix-dxf", "crates/eh3d-phoenix-si", "crates/eh3d-phoenix-spatial", "crates/eh3d-phoenix-autoroute", "crates/eh3d-phoenix-field2d", "crates/eh3d-phoenix-stats", "crates/eh3d-phoenix-testpoints", "crates/eh3d-phoenix-ipc2581", "crates/eh3d-phoenix-server", "crates/eh3d-phoenix-boarddiff", "crates/eh3d-phoenix-ulp", "crates/eh3d-phoenix-console", "crates/eh3d-phoenix-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-PHOENIX-PCB"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# the shared repository, next to this one; CI checks out the tag named in SIBLING_REFS
eh3d-container = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/container" }
eh3d-diagnostic = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/diagnostic" }
# the one project file of the suite, with a branch for each program
eh3d-project = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/project" }
eh3d-materials = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/materials" }
eh3d-serverclient = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/serverclient" }
# the frame of the window: panels that dock, float and fold, workspaces, the menu bar and the shortcuts (the model has no window; drawing it is the feature `gui` of the viewer)
eh3d-dock = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/dock", default-features = false }
# the panel of the attachments of a project that every program of the suite shows (the model has no window; drawing it is the
# feature `gui` of the viewer), and the window state that chooses files
eh3d-attachpanel = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/attachpanel" }
eh3d-filedialog = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/filedialog" }
# the languages of the frame
eh3d-view = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/view", default-features = false }
tempfile = "3"
