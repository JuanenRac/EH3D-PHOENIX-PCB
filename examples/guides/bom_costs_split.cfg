# Settings of the bill of materials for the guide: the default grouping (value, footprint, maker
# and part number) and a short list of columns for the CSV file.
# The numbers are an example of the shape of a tariff, not the prices of any maker.
currency = EUR
boards = 10
pcb_area_rate.1 = 0.04
pcb_area_rate.2 = 0.06
group_by = value,footprint,manufacturer,mpn
csv_columns = references,quantity,value,footprint,manufacturer,mpn,status
