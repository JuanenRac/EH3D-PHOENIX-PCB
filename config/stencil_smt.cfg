# Settings of the solder paste stencil with the public figures that the pages of JLCPCB and PCBWay
# give for the paste of surface-mount assembly, for `phoenix stencil --stencil-config
# config/stencil_smt.cfg` (and `phoenix fabpack`). Nothing here was compared with a maker.
#
# The figures of the pages, for the reader of this file:
# * plate thickness 0.10 to 0.15 mm (0.08 mm for the finest pitch); the line uses 0.12 mm;
# * area ratio above 0.66 and aspect ratio of at least 1.5 (the limits of IPC-7525);
# * reduction of the openings 5 to 7 % (10 to 20 % for fine pitch); the line uses 6 %, and the
#   fine pitch reduction is left to a `reduce = PATTERN VALUE` line of your own;
# * paste coverage of 50 to 75 % of a large pad, given as windows (the splitting below), and
#   voiding under 25 %;
# * pads more than 1.27 mm apart and parts at least 1 mm apart.

thickness_mm = 0.12
min_aspect = 1.5
min_area_ratio = 0.66
shrink = 6%
