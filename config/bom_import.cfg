# Map of the columns for importing the bill of materials of another program (`phoenix bom
# --import FILE`). Every line is optional; a missing line keeps the default shown here.
#
# This map is for a generic CSV file (`--import-format csv`, which is also what an unknown file is
# taken for). The names below are common English column names; copy this file, put the names of the
# columns of YOUR file in it and pass it with --import-map. Names are compared without regard to
# case; several names for one column are separated by a bar, and for each line the first of those
# columns that has a cell is used.
#
# The partlist of EAGLE (`--import-format eagle`) and the CSV and XML bills of KiCad
# (`--import-format kicad-csv`, `kicad-xml`) have the column names of their own, which this file does
# not change; from this file they take the limits at the end, the separators of references and the
# cells that mean "not fitted".

# The character between the cells: comma, semicolon or tab.
delimiter = comma

# The columns. Only the references are required.
references = references|reference|refs|reference(s)|designator|refdes|ref
value = value|val|comment
footprint = footprint|package|pattern
manufacturer = manufacturer|maker|mfr
mpn = mpn|part number|manufacturer part number
quantity = quantity|qty

# A column that says whether the part is fitted: a cell in not_fitted_values means it is not. And
# a column that says the part is not to be fitted: a cell in dnp_values means it is not.
fitted = fitted
dnp = dnp|do not populate
not_fitted_values = no|n|false|0|dnp
dnp_values = yes|y|true|1|x|dnp

# The characters that separate several references in one cell (a comma, a space, a semicolon).
# A range such as R1-R5 (or R1-5) names R1, R2, R3, R4 and R5.
reference_separators = , ;

# The most lines read.
max_rows = 100000

# The most parts one range of references may name (R1-R1001 is refused with PHOENIX-BOM-024 while
# this is 1000), and the most references all the lines may name together, ranges expanded.
max_range = 1000
max_references = 200000
