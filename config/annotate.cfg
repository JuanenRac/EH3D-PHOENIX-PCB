# Settings of the annotation back into the schematic (`phoenix annotate ... --config`).
# Every line is optional; a missing line keeps the value shown here. This file is also the default
# that is built into the program.

# What the plan takes from the board. The reference designators, values and footprints of the
# components are written into the parts they were made from; false leaves that kind of change in
# the plan as ignored, with the reason.
values = true
footprints = true

# Renumbering by position. When true the plan also renumbers the components of the board by the
# place they lie in (so that R1, R2, R3 follow the layout) and proposes the new references for the
# schematic and for the board. It is false by default because it changes names that people know.
renumber = false

# The order of the numbers: left_to_right numbers the components column by column (left to right,
# and inside a column from the top down); top_to_bottom numbers them row by row (from the top
# down, and inside a row from left to right). A column or a row is the set of components whose
# coordinate across it lies within row_tolerance_nm of the first of the set (2000000 = 2 mm).
order = top_to_bottom
row_tolerance_nm = 2000000

# On the board the Y axis grows upwards (true) or downwards (false). It decides what "top" is.
y_axis_up = true

# The first number and the step between two numbers. A prefix can have its own start and step:
# start.R = 1, step.C = 10. A reference whose prefix is not named takes the general values.
start = 1
step = 1

# The prefixes (the letters of the reference) that are renumbered, separated by commas; empty
# means all of them. The references named in `locked` keep their name and their number is never
# given to another component.
prefixes = R, C, L, D, Q, U
locked =

# Number the two sides of the board apart: the components of the bottom side start at
# start + bottom_offset (R1.. on top, R101.. on the bottom).
by_side = false
bottom_offset = 100

# Equivalent pins and gates, per symbol name. A group is written as slots separated by `|`, and a
# slot is the pin numbers of one gate separated by commas; groups are separated by `;`. When the
# board connects the slots of a group to the nets of the schematic the other way round, the plan
# proposes the swap. Examples:
#   swap.CONN2 = 1 | 2                     the two pins of a connector are interchangeable
#   swap.74HC00 = 1,2,3 | 4,5,6 | 9,10,8   the gates of a quad NAND (inputs and output, in order)
# Nothing is listed by default.
