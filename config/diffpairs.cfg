# Settings and pairs of the differential pairs of the board editor (`phoenix pairs`, the pair
# operations of `phoenix boardedit` and the pair tool of the board mode of the viewer window).
# Every setting line is optional; a missing line keeps the value shown here. This file is also the
# default that is built into the program. The same pairs can be given in a JSON file (format
# phoenix-diffpairs/1, `phoenix pairs --pairs FILE`); a pair of that file wins over a pair of this
# file with the same name.

# The width of the tracks of a pair and the gap between the edges of its two tracks when a pair
# gives none, in nanometres.
default_width_nm = 150000
default_gap_nm = 150000

# How much the lengths of the two nets of a pair may differ, and the most that may run uncoupled
# (outside the coupling range of the other net), in nanometres.
default_length_tolerance_nm = 100000
default_max_uncoupled_nm = 5000000

# How far the gap and the width may be from the ones asked for, in nanometres.
gap_tolerance_nm = 25000
width_tolerance_nm = 10000

# The widest gap at which two pieces still count as coupled, in nanometres.
coupling_range_nm = 1000000

# How much the coupled length of the positive net and of the negative net may differ, in
# nanometres (a pair that runs side by side but whose two nets are coupled on different lengths
# is not symmetric).
symmetry_tolerance_nm = 500000

# A via of one net is paired with a via of the other net on the same layers within this distance,
# in nanometres.
via_pair_range_nm = 3000000

# When a pair changes layer, the via of the negative net is moved this far along the pair so that
# the two vias do not touch, in nanometres (per axis for a 45-degree piece; 0 puts them side by
# side).
via_stagger_nm = 1000000

# How far the differential impedance worked out from the stack-up may be from the target of a
# pair, in parts per thousand (100 = 10 percent), and the frequency it is worked out at, in MHz.
impedance_tolerance_permille = 100
impedance_frequency_mhz = 1000

# The most pairs a file may hold.
max_pairs = 1000

# Pairs can be given here, one block of lines for each, as pair.NAME.field = value. Fields:
# positive and negative (the names of the nets), width_nm, gap_nm, length_tolerance_nm,
# max_uncoupled_nm and target_diff_ohm. Example (leave commented out unless a board has the nets):
# pair.USB.positive = USB_P
# pair.USB.negative = USB_N
# pair.USB.width_nm = 150000
# pair.USB.gap_nm = 150000
# pair.USB.target_diff_ohm = 90
