# Defaults of `phoenix spread`: the impedance of a microstrip or a centred stripline when the
# width, the height of the dielectric and the permittivity are off by their tolerances. Every
# line is optional; a missing line keeps the default shown here, and an option of the command
# line wins over it.

# The thickness of the copper of the track, in micrometres (0 to 500); 35 is 1 oz.
thickness_um = 35
# The plus or minus tolerance of the width of the track, in micrometres (0 to 10000). 0 means
# none: the figures of the maker go here.
tol_width_um = 0
# The plus or minus tolerance of the height of the dielectric, in micrometres (0 to 10000).
tol_height_um = 0
# The plus or minus tolerance of the relative permittivity (0 to 10).
tol_er = 0
# How far from the target impedance the whole box of the tolerances may be, in per cent
# (0 to 100); only used with --target.
percent = 10
