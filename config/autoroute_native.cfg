# Settings of the autorouter that needs no outside program (`phoenix autoroute native`). This file
# is also the default that is built into the program. A line that is left out keeps the value
# shown here; a key the program does not know, a key written twice and a value out of range are
# refused with the code PHOENIX-AROUTE-001. The width of a track, the size of a via and the
# clearances come from the rules and from `config/route.cfg`; this file holds what the search
# itself needs. Every limit counts nodes and passes, never time, so the same board always gives
# the same result.

# The pitch of the routing grid, in nanometres (1000 to 5000000). A finer grid finds more routes
# and expands more nodes.
grid_nm = 250000

# The order of the nets: shortest (the shortest connections first), widest (the widest tracks
# first) or critical (the nets of critical_nets first).
order = shortest

# The nets that go first with the order critical, by name, separated by commas.
critical_nets =

# Whether tracks may run at 45 degrees as well as along the axes.
diagonal = true

# The cost of one corner, as nanometres of track.
corner_penalty_nm = 200000

# The cost of one via, as nanometres of track.
via_penalty_nm = 3000000

# How much more a step costs against the preferred direction of its layer, in percent. The first
# layer prefers horizontal steps, the second vertical ones, and so on.
wrong_way_percent = 50

# The cost of a step through the copper of another net when the search looks for the nets that
# are in the way of a connection that could not be routed.
ripup_penalty_nm = 20000000

# The cost added to a node of a route that was torn up, for each time it was.
history_penalty_nm = 1000000

# The most nodes one search may expand, and the most that all the searches of a run may expand.
max_expansions_per_search = 400000
max_expansions_total = 20000000

# The most times a route is torn up to make room for another, in all, and for one connection.
max_ripup_iterations = 40
max_rips_per_connection = 4

# The most nodes of the grid (nodes of one layer times layers) and the most connections.
max_nodes = 8000000
max_connections = 20000

# How many places near a pad are tried as the start or the end of a track, and how far from the
# pad they are looked for, in grid pitches beyond the size of the pad.
terminal_candidates = 6
terminal_radius_cells = 4

# Whether the copper zones of other nets are obstacles. They are by default: a zone is not
# poured around the new tracks by this program.
zones_block = true

# Whether a via may be put on a pad.
via_in_pad = false
