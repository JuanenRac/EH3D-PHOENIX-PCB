# Settings of the library of footprints by the method of IPC-7351B (`phoenix ipc ... --config`).
# The dimensions of each family are not here: they are in config/ipc_families/, one file per
# family. Every line is optional; a missing line keeps the default shown here.

# Checks of the library.
# The least distance from the silkscreen to a pad, in millimetres.
silk_clearance_mm = 0.15
# How far the middle of the pads may be from the origin of the footprint, in millimetres.
origin_tol_mm = 0.005
# The tolerance of the smallest distance between pad centres against the pitch of the family.
pitch_tol_mm = 0.002
# The tolerance of the courtyard against the one the density level asks for.
courtyard_tol_mm = 0.001
# The largest percentage of paste an exposed pad may have.
ep_paste_max_percent = 90

# Comparison with a footprint of the owner: pads closer than this to the generated ones in
# position and size count as the same, in millimetres.
compare_tol_mm = 0.05

# The density level used when none is asked for: A (most), B (nominal) or C (least).
default_density = B

# Bounds of the files that are read.
max_family_bytes = 1048576
max_family_files = 64
max_file_bytes = 67108864
