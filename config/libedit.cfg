# Settings of the library editor (`phoenix libedit ... --config`, and the library mode of the window).
# Every line is optional; a missing line keeps the default shown here.

# How many steps of undo are kept in the window.
history_limit = 200

# The bounds of the library file that is read.
max_file_bytes = 268435456
xml_max_depth = 256
xml_max_nodes = 20000000

# Checks of the library.
# How far outside the box of the pads the origin of a footprint may be before it is reported (nm).
origin_tolerance_nm = 100000
# The clearance between silkscreen and a pad below which it is reported (nm); zero reports only
# silkscreen that touches the copper.
silk_clearance_nm = 0
# The layers of silkscreen that are checked against the pads, and the layers a surface-mount pad
# may have its copper on.
silk_layers = 21,22
copper_layers = 1,16
# Report a footprint without the texts >NAME and >VALUE.
require_name_texts = true

# The window. The grids are in nanometres: 50000 is 0.05 mm for footprints, 1270000 is 50 mil
# for symbols. The distance of a click to an item is in screen points.
grid_nm = 50000
symbol_grid_nm = 1270000
snap = true
pick_px = 8

# The expansion of the openings of solder mask and solder paste that the window makes around a
# pad (nm). A negative value shrinks the opening.
mask_expansion_nm = 50000
paste_expansion_nm = 0
