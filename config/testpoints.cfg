# Settings of the test points of a board (`phoenix testpoints`).
# Every line is optional; a missing line keeps the default shown here. A list is words
# separated by commas.

# A part whose reference starts with one of these words (any case) and goes on with a digit, a
# mark or nothing is a test point: TP1 and TP_GND are, TPS5 is not.
testpoint_prefixes = TP
# A part whose footprint name holds one of these words (any case) is a test point.
testpoint_footprint_words = testpoint, test_point, test-point

# Whether a pad the board marks as a test point counts (the mark is part of the board model, and the
# operation SetTestPoint of the editor sets it): true or false.
use_marks = true
# Whether the prefixes and the words above recognise test points: true or false. With both off
# nothing is recognised.
use_names = true

# Whether a test point must have an opening in the solder mask on its side, that is, a solder mask
# layer of its side (or of no side) among the layers of its pad: true or false. A test point without
# one gets PHOENIX-TP-013.
require_mask_opening = false

# The side of the board that the probes touch: both, top or bottom.
probe_side = both
# The test points on the probed side that every net must have.
required_per_net = 1
# A net with fewer pads than this is not asked to have a test point.
min_pads_for_test = 2
# Nets that are not asked to have a test point (any case); a name that ends in * matches every
# net that starts with the rest.
ignore_nets = NC, N/C, UNCONNECTED*

# The smallest side of a test point, in nanometres. 0 leaves it unjudged.
min_pad_nm = 1000000
# The smallest distance between the centres of two test points on the same side, in nanometres.
# 0 leaves it unjudged.
min_spacing_nm = 1270000
# The smallest distance from the centre of a test point to the edge of the board, in nanometres.
# 0 leaves it unjudged.
min_edge_nm = 1000000
# The smallest distance from the centre of a test point to the centre of a pad of any other part on
# the same side that is not itself a test point, in nanometres: a probe needs room around the point.
# 0 leaves it unjudged.
min_part_clearance_nm = 0

# How serious a net without access is: info, warning or error. With error the command
# `phoenix testpoints` exits with 1.
uncovered_severity = warning

# The most objects (parts, connected pads and nets) a board may hold for the check to run.
max_items = 1000000
