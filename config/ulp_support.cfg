# The names of the user programs that the compatibility report knows, and what is decided for each
# (`phoenix ulp report`). One name for each line: `kind name status`.
#
# kind    directive, statement, type, function, member or constant. A name that ends in * stands for
#         every name that starts with the rest; an exact name wins over one with a star.
# status  allowed  read access to the model and pure computation; the sandbox lets it through
#         limited  allowed inside the limits of the sandbox (a private folder for the files, a size
#                  limit, no command of the operating system)
#         pending  not decided or not written yet; a program that uses it is partly covered
#         denied   the sandbox never lets it through; a program that uses it is not covered
#
# Nothing is run yet: this list says what a program would need, not what runs today. It is a data
# file on purpose, so the scope follows the programs that are really used and not a manual.

# directives
directive include limited
directive usage allowed
directive require allowed

