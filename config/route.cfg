# Settings of the router and of the editing logic (`phoenix route ... --settings`).
# Every line is optional; a missing line keeps the default shown here. Lengths are in nanometres.

# The pitch of the coarse mesh the router searches on, anchored at the start of the track. A
# smaller pitch finds narrower ways and takes longer.
grid_nm = 250000
# How far beyond the box of the two ends the search may go, in nanometres. The board outline
# limits it further when the board has one.
search_margin_nm = 10000000
# The most mesh points (times copper layers) of one search. When the area needs more, the pitch
# is doubled until it fits.
max_cells = 200000
# The most states the search may take out of its queue before it gives up.
max_expansions = 3000000
# The cost of one corner and of one via, in nanometres of track. The route with the least cost
# (length plus corners plus vias) is the one that is made.
corner_penalty_nm = 500000
via_penalty_nm = 5000000
# Allow turns sharper than 90 degrees (a turn of 135 degrees leaves an acute angle of copper).
allow_acute = false
# How many mesh pitches around the end the search tries to finish with one or two straight pieces.
final_reach_cells = 4

# The width of a track whose net has no class that gives one.
default_width_nm = 250000
# The drill and the pad diameter of a via made by the router; the diameter is raised to what the
# rules and the net class ask for, and to the drill plus two annular rings.
via_drill_nm = 300000
via_diameter_nm = 600000
# A margin added to every clearance, so that a result never sits exactly on a limit.
clearance_margin_nm = 1000
# The side of the squares of the index of obstacles.
bucket_nm = 2000000
# The shortest track that the mode that stops at obstacles still makes.
stop_min_length_nm = 100000

# An edit that would add a rule error is refused (false lets it through and only reports it).
strict_edits = true
# Moving a vertex may not turn a piece that was at 0, 45 or 90 degrees into another angle.
keep_angles = true

# The most pairs of points the ratsnest compares before it gives up.
ratsnest_max_pairs = 50000000
# How many ids are tried when a new part needs one that is free.
id_attempts = 64
