# Settings of the circuit simulator (`phoenix sim ... --config`).
# Every line is optional; a missing line keeps the default shown here.

# The largest netlist file that is read, in bytes.
max_file_bytes = 4194304
# The most lines of a netlist.
max_lines = 200000
# The most elements after the subcircuits are expanded.
max_elements = 20000
# The most unknowns (node voltages and branch currents). The solver is dense, so the time grows
# with the cube of this number.
max_unknowns = 1500
# The deepest nesting of subcircuit instances (a subcircuit that calls itself stops here).
max_subckt_depth = 16
# The deepest nesting of an expression between braces.
max_expr_depth = 32
# The most frequencies of an AC sweep.
max_ac_points = 100000
# The most time steps of a transient analysis.
max_tran_steps = 1000000
# The most values (points times unknowns) of one result.
max_result_cells = 10000000

# The temperature in degrees Celsius; it sets the thermal voltage kT/q of the diodes.
temperature_c = 27.0

# The relative tolerance of the Newton-Raphson iteration and of the adaptive time step.
reltol = 0.001
# The absolute tolerance of a voltage, in volts.
vntol = 0.000001
# The absolute tolerance of a current, in amperes.
abstol = 0.000000000001
# The conductance across every diode (and across every node when a circuit is started from its
# initial conditions), in siemens.
gmin = 0.000000000001
# A pivot smaller than this fraction of the largest value of its column means the matrix is
# singular.
pivot_tolerance = 0.000000000001
# The most iterations of one Newton-Raphson solution.
newton_max_iter = 100
# The steps of the source stepping that is tried when the plain iteration does not converge.
source_steps = 20
# The conductance that holds the initial voltage of a capacitor when the analysis starts from the
# initial conditions (uic), in siemens.
ic_conductance = 1000000000.0

# The smallest adaptive time step, as a fraction of the step asked for.
min_step_fraction = 0.000001
# The first adaptive time step, as a fraction of the step asked for.
initial_step_fraction = 0.1
# The safety factor of the adaptive step (below 1).
step_safety = 0.9
# The most the adaptive step grows at once.
step_max_growth = 2.0
# The most the adaptive step shrinks at once.
step_min_shrink = 0.25

# The group delay is taken from the phase at the frequency minus and plus this fraction of it.
delay_step_fraction = 0.0001

# A node with no DC path to ground stops an operating-point analysis (false holds it with gmin).
floating_is_error = true
# The names that mean ground in a netlist (lower case, separated by commas).
netlist_ground = 0, gnd
# The names of nets that mean ground in a schematic.
schematic_ground = 0, gnd, agnd, dgnd, pgnd

# The saturation current and the emission coefficient of a diode model that does not give them.
diode_is = 0.00000000000001
diode_n = 1.0

# The steps of the gmin stepping that is tried when the plain iteration does not converge (zero
# turns it off). The conductance from every node to ground starts at gmin_start and is divided
# by gmin_factor at each step, one Newton-Raphson solution per step, and then taken away.
gmin_steps = 10
# The conductance from every node to ground at the first step of the gmin stepping, in siemens.
gmin_start = 0.01
# The factor by which that conductance is lowered at each step.
gmin_factor = 10.0

# The most breakpoints (corners of pulses and piecewise-linear sources) that an adaptive
# transient analysis may stop at.
max_breakpoints = 100000

# Defaults of the device models, used when a .model line does not give the parameter.
# The current at the breakdown voltage of a diode, in amperes.
diode_ibv = 0.001
# The saturation current, the forward and the reverse gain of a bipolar transistor.
bjt_is = 0.0000000000000001
bjt_bf = 100.0
bjt_br = 1.0
# The threshold voltage (V), the transconductance parameter (A/V^2) and the channel-length
# modulation (1/V) of a MOSFET, and the width and the length (m) when neither the model nor the
# instance give them.
mos_vto = 0.0
mos_kp = 0.00002
mos_lambda = 0.0
mos_w = 0.0001
mos_l = 0.0001
# The macromodel of an operational amplifier: open-loop DC gain, gain-bandwidth product (Hz, zero
# for no pole), output resistance (ohm) and the resistance of the node that holds the pole.
opamp_gain = 100000.0
opamp_gbw = 1000000.0
opamp_rout = 1.0
opamp_pole_ohms = 1000.0
# A comparator: the high and low output levels (V) and the slope at zero difference (V/V).
comparator_high = 5.0
comparator_low = 0.0
comparator_gain = 10000.0

# How many times an output file is tried again when another program holds it, and the wait
# between two tries in milliseconds.
write_retries = 5
write_retry_ms = 50

# The coherence check against a ladder filter of the RF tools: the number of frequencies, and the
# largest differences accepted (magnitude in dB, phase in degrees, group delay as a fraction of a
# period).
coherence_points = 41
coherence_db_tolerance = 0.000001
coherence_phase_tolerance_deg = 0.00001
coherence_delay_tolerance = 0.0001
