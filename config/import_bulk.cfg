# Settings of the bulk import of libraries (`phoenix libindex ... --config`). Every line is
# optional; a missing line keeps the default shown here.

# The bounds of the walk through the folder. Links are never followed, and nothing outside the
# folder that was given is read.
max_files = 5000
max_file_bytes = 67108864
max_depth = 16
# The most footprints and symbols that are indexed.
max_items = 500000

# The grid to which the geometry of the pads is rounded before two footprints are compared, in
# millimetres.
geometry_round_mm = 0.01

# A footprint whose origin is farther than this from its pads is reported, in millimetres.
origin_far_mm = 10
