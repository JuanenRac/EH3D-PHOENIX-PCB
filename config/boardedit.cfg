# Settings of the board editor (`phoenix boardedit ... --settings`, and the board mode of the viewer
# window). Every line is optional; a missing line keeps the value shown here. This file is also the
# default that is built into the program. The viewer settings file does not hold these: it refuses
# keys it does not know.

# The grid that points snap to, in nanometres (250000 = 0.25 mm), and whether snapping is on.
grid_nm = 250000
snap = true

# How far from a track or a via a click still picks it, and the space added around the pads of a
# component to make the box that picks the component, in nanometres.
pick_tolerance_nm = 300000
part_padding_nm = 500000

# Run the design rule check after every operation, and refuse an operation that adds a rule error
# (an operation can be forced one by one; the check still reports what it adds).
live_drc = true
reject_new_errors = true

# When a component is moved, turned or mirrored, the ends of the tracks that were on its pads follow.
follow_tracks = true

# Tracks may use 45-degree pieces (false: horizontal and vertical pieces only), and a corner goes
# first along x (true) or first along y (false).
diagonal_routes = true
corner_horizontal_first = true

# The width of a track that has no net class asking for another, and the size of a via, in
# nanometres. The rules and the net classes raise these when they ask for more.
track_width_nm = 250000
via_drill_nm = 300000
via_diameter_nm = 600000

# The meanders that tune a net to a length: the amplitude they start with, the largest amplitude,
# the run of one half period, how far from the target the length may end, and how many places (the
# longest straight pieces) are tried before the operation is refused. All in nanometres.
meander_amplitude_nm = 1000000
meander_max_amplitude_nm = 3000000
meander_pitch_nm = 400000
length_tolerance_nm = 100000
meander_candidates = 3

# The push of neighbour tracks when a track is routed with `route_shove`: how many levels deep a push
# may go (a track that is pushed pushes the next one), the most tracks it may move, and the gap added
# to the clearance of the rules, in nanometres. A push that needs more is refused and changes nothing.
shove_max_depth = 3
shove_max_moved = 8
shove_margin_nm = 1000

# The arcs of tracks (`route_arc`, `round_corners`): the smallest radius, how many chords a quarter
# turn is cut into to check the arc against the rules, and the gap added to the clearance of the
# rules, in nanometres.
arc_min_radius_nm = 500000
arc_steps_per_quarter = 8
arc_margin_nm = 1000
