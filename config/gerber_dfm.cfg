# Settings of the geometric checks of Gerber files against a capability profile of a maker
# (`phoenix check --gerber-dfm FOLDER|ZIP --profile NAME`). Every line is optional; a missing line
# keeps the default shown here. Lengths are in nanometres (1 mm is 1000000). The limits of the
# checks themselves (track width, spacing, ring, edge, mask bridge) come from the profile of the
# maker, never from this file; none of the figures of those profiles is verified.

# How exactly the shapes are drawn and joined. A circle or an offset is drawn inside the true one by
# at most offset_tolerance_nm; the corners of the shapes move to a grid of grid_nm; one operation
# refuses regions with more than max_edges edges (the check is then reported as skipped).
offset_tolerance_nm = 500
grid_nm = 1
max_edges = 2000000

# The drill is not placed exactly: the ring of copper that is left round a plated hole is checked
# with this much of registration error taken from it in the worst case.
registration_nm = 50000

# A hole without a tool attribute that says it is a via counts as a via when its drill is not
# larger than this.
via_max_drill_nm = 450000

# A narrow piece or a narrow gap is reported only when its area is at least this part (in
# thousandths) of the square of the limit it breaks. The rounded corners that the tests leave at
# every corner are smaller than that.
corner_area_factor_x1000 = 250

# An overlap (silkscreen over a pad) smaller than this area, in square nanometres, is rounding.
area_floor_nm2 = 1000000

# The most findings kept for one check (the rest are counted), the most holes and the most anchor
# points (flashes, ends of tracks, holes) that the checks look at.
max_findings = 100
max_holes = 50000
max_anchors = 500000

# An arc of a file is cut into straight pieces that stay within arc_chord_nm of it.
arc_chord_nm = 5000

# The limits of a ZIP archive of Gerber files, read in memory and never written to disk: the most
# entries, the most bytes of all of them once unpacked, and how much an entry may grow compared
# with its packed size.
zip_max_entries = 2000
zip_max_total_bytes = 2000000000
zip_max_ratio = 200

# Two things of a layer that are closer than this are one thing (they touch). The most pairs of
# things close to each other that the spacing check looks at in one layer.
touch_nm = 1000
max_pair_tests = 2000000
