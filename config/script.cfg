# Settings of the script interpreter (`phoenix script ... --config`).
# Every line is optional; a missing line keeps the default shown here.

# The bounds of a script: its size, its lines, its commands (counting the scripts it includes),
# the arguments of one command, the length of a text in quotes and the nesting of included scripts.
max_script_bytes = 1048576
max_lines = 20000
max_commands = 10000
max_args = 512
max_string_chars = 256
max_depth = 4

# The most operations one run may make; a run that needs more is refused whole.
max_operations = 100000

# The bounds of the report over a folder of scripts, and of the files read by OPEN.
max_files = 2000
max_walk_depth = 16
max_file_bytes = 16777216

# The bounds of an output job.
max_cam_bytes = 262144
max_cam_sections = 256

# A line break ends a command like a semicolon does; a backslash at the end of a line joins it to
# the next one. With false only the semicolon ends a command.
newline_ends_command = true

# A command that is pending is skipped with a warning instead of stopping the whole run. An unknown
# command always stops it.
skip_pending = false

# What the file commands may do. All three are off; and they only use the folders listed in
# allowed_dirs, relative to the folder of the script (. is that folder). An absolute path, a path
# with .. and a path through a link are always refused. The list is empty: no folder is allowed.
allow_script = false
allow_write = false
allow_open = false
allowed_dirs =

# The state at the start of a run: the unit of a number without a unit, the grid, the width of a
# wire, the drill and the diameter of a via, the height of a text and the width of its stroke as a
# percentage of its height. Lengths are in nanometres.
default_unit = mm
default_grid_nm = 1270000
default_width_nm = 254000
default_drill_nm = 300000
default_via_diameter_nm = 600000
default_text_height_nm = 1270000
text_ratio_percent = 8

# The identities of the objects a script makes come from this seed and this clock, so the same
# script on the same board always gives the same result.
id_seed = 126870958469236
id_epoch_ms = 1700000000000

# The names that the layer numbers of the original workflow stand for on the board (number:name).
layer_numbers = 1:Top, 16:Bottom, 20:Dimension, 21:tPlace, 22:bPlace, 25:tNames, 26:bNames, 27:tValues, 28:bValues, 29:tStop, 30:bStop, 31:tCream, 32:bCream, 51:tDocu, 52:bDocu

# Commands of the original language that are known and have no equivalent yet. They are listed as
# pending with their cause; any other unknown word is an unknown command.
known_pending = ADD, ARC, ASSIGN, ATTRIBUTE, AUTO, BOARD, BUS, CLASS, CLOSE, COPY, CUT, DESCRIPTION, DIMENSION, EDIT, ERRORS, EXPORT, FRAME, GATESWAP, HOLE, INFO, INVOKE, JUNCTION, LABEL, LOCK, MARK, MENU, MIRROR, MITER, NET, OPTIMIZE, PACKAGE, PAD, PASTE, PIN, PINSWAP, PLAY, POLYGON, PREFIX, PRINT, QUIT, REDO, REMOVE, RENAME, REPLACE, RIPUP, ROUTE, RUN, SCAN, SHOW, SIGNAL, SMASH, SPLIT, SYMBOL, TECHNOLOGY, UNDO, UPDATE, USE, WINDOW

# Options of SET that only change how the original tool looks or behaves: accepted and ignored.
set_ignored = BEEP, CONFIRM, DISPLAY_MODE, PALETTE, COLOR_LAYER, FILL_LAYER, USED_LAYERS, UNDO_LOG, WIRE_BEND, AUTO_JUNCTION, POLYGON_RATSNEST, VECTOR_FONT

# Scripts of the second version (phoenix-script/2). Time is counted in steps of the interpreter
# (one for every statement and every part of an expression), not in seconds, so the same script
# stops at the same place on every computer. A loop that turns more than max_loop_iterations times
# is stopped.
max_steps = 1000000
max_loop_iterations = 10000
max_block_depth = 16
max_expr_depth = 32

# Memory is counted in cells: a number or an object is one cell, a list is one cell and the cells of
# its items, a text is one cell and one more for every 16 characters. max_text_bytes bounds a text
# made while running and max_output_bytes everything that print writes.
max_value_cells = 20000
max_list_len = 5000
max_text_bytes = 262144
max_output_bytes = 65536

# The only place a script of the second version can read or write files: a folder below the folder of
# the script (empty: none). Paths are relative without .., a link is not followed, a file that
# exists is never replaced and nothing is written by a dry run.
data_dir =
max_data_files = 8
max_data_bytes = 1048576
