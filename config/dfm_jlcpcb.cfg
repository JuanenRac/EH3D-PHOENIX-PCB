# Capability profile of the standard rigid FR-4 service of JLCPCB, for `phoenix check --dfm-profile
# jlcpcb <board>` (or `--dfm config/dfm_jlcpcb.cfg`).
#
# The figures are the PUBLIC, GUIDING numbers of the maker's capabilities page named in `source`,
# for a double-sided board with 1 oz copper. Such a page changes without notice, so read it again
# before ordering: this file only shows what the page said when it was read. Nothing checks the
# file against the maker, which is why verified stays false (PHOENIX-DFM-006 says so in the report).
# Edit a figure here, never in the program. Lengths are in nanometres (1 mm is 1000000); a line
# with 0 or a missing line is off.
#
# Where one number cannot say what the page says:
# * min_annular_ring_nm is the 0.05 mm of a via (pad 0.1 mm larger than the hole); the page asks
#   0.15 to 0.25 mm for the pads of drilled parts, which this one line cannot tell apart.
# * min_mask_bridge_nm is the 0.10 mm of green, red, yellow, blue and purple masks (black and white
#   ask 0.13 mm; any colour with 2 oz copper asks 0.20 mm).
# * min_drill_nm is the 0.15 mm of the table for two or more layers (a single-sided board asks
#   0.3 mm; the page also names 0.1 mm at extra cost for thin boards).
# * min_drill_spacing_nm is the via-to-via hole spacing; pad-to-pad holes ask 0.45 mm.
# * The board size is the one for two layers (670 x 600 mm); fewer or more layers differ a little.
# * Nothing here sets a number of holes (the page gives none).

name = JLCPCB standard rigid FR-4
source = https://jlcpcb.com/capabilities/pcb-capabilities (public figures, double-sided, 1 oz copper)
verified = false

# The limits of the usual rule check (they replace the rules of the board for this run).
min_track_width_nm = 100000
min_clearance_nm = 100000
min_drill_nm = 150000
min_via_diameter_nm = 250000
min_annular_ring_nm = 50000
min_edge_clearance_nm = 200000
min_mask_bridge_nm = 100000
min_drill_spacing_nm = 200000
connect_tolerance_nm = 0
silkscreen_over_pads = true
silkscreen_over_mask_openings = false

# What the maker can build at all.
max_copper_layers = 32
min_board_short_nm = 3000000
min_board_long_nm = 3000000
max_board_short_nm = 600000000
max_board_long_nm = 670000000
max_drill_nm = 6300000
max_holes = 0
