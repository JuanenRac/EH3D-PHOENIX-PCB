# Settings of the 3D assembly (`phoenix assembly3d`).
# Every line is optional; a missing line keeps the default shown here.
# Lengths are in nanometres.

# The thickness of the board when no stack-up (--stackup) gives it.
default_board_thickness_nm = 1600000
# The tallest a component may stand above, or hang below, the board. This is the room of your
# enclosure, so set it to your own number; 0 turns the check off.
max_component_height_nm = 25000000
# How deep two component boxes must overlap, in every direction, to count as a collision. Boxes
# that only touch never collide.
min_overlap_nm = 1000
# Report a component whose box is not inside the outline of the board (true or false).
check_outline = true

# The most components a run handles and the most findings of one kind it lists.
max_components = 50000
max_findings = 1000
# The largest input file, in bytes, and the most entities of a STEP file.
max_file_bytes = 16777216
max_step_entities = 2000000
