# Settings of the corpus inventory. Every line is optional; a missing line keeps the default shown here.

# Most files the inventory will look at; more than this stops the run with an error.
max_files = 200000
# Deepest folder nesting it will enter.
max_depth = 32
# Bytes at the start of a design file that are looked at to tell its kind.
sniff_bytes = 8192
# Largest design file read whole for the fingerprint; a larger one is counted as oversize.
max_file_bytes = 268435456
# Add one fingerprint of the content of all design files to the report.
fingerprint = true
