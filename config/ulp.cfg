# Settings of the reader and of the evaluator of user programs (`phoenix ulp`).
# Every line is optional; a missing line keeps the default shown here. The first limits bound what
# the reader is willing to read; the ones under "The limits of a run" bound what `phoenix ulp run`
# is willing to do.

# The largest program, in bytes (1 to 1073741824).
max_source_bytes = 1048576
# The most tokens a program may have (1 to 100000000).
max_tokens = 200000
# The deepest nesting of blocks, parentheses and expressions (1 to 500). The reader calls itself
# once for each level, so this is also what bounds its use of memory.
max_depth = 100
# The most statements a program may have, declarations and functions included (1 to 10000000).
max_statements = 50000
# The longest text in quotes, in characters (1 to 16777216).
max_string_chars = 65536
# The longest name, in characters (1 to 4096).
max_name_chars = 128
# The most problems that are kept for a program; the rest are counted (1 to 100000).
max_problems = 50

# The limits of a run (`phoenix ulp run`). A program that goes beyond one of them stops with an
# error and nothing else is written.
# The most steps; every statement and every part of an expression counts one (1 to 4000000000).
max_steps = 1000000
# The most memory the variables may hold, in bytes (1024 to 1073741824).
max_memory_bytes = 16777216
# The deepest nesting of statements, expressions and calls of functions (1 to 2000). The evaluator
# calls itself once for each level, on a stack made for the run.
max_eval_depth = 200
# The most bytes the program may write (0 to 1073741824).
max_output_bytes = 1048576
# The most elements one array may have (1 to 10000000).
max_array_elements = 100000

# The files of a run. The one folder a program may read from and write into with `output`,
# `fileread`, `fileglob`, `filesize` and `filetime`; empty means no file is opened. A program names
# files with relative names inside it (no `..`, no drive, no absolute path), and a link that leaves
# the folder is refused. Nothing is written until the block of `output` ends without an error.
file_dir =
# The most bytes one file may have, written or read (1 to 1073741824).
max_file_bytes = 1048576
# The most files a run may open (1 to 10000).
max_files = 64
# How deep the files of `#include` may go, one naming the next (1 to 64).
max_include_depth = 8

# The grid that a program reads as `grid.unit` and `grid.distance`: the model keeps none, so this is
# the answer. The unit is 0 micron, 1 millimetre, 2 mil or 3 inch; the distance is in nanometres
# (1 to 1000000000).
grid_unit = 1
grid_distance_nm = 1000000
