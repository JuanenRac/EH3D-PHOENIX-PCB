# Settings of the test of hostile input (`crates/eh3d-phoenix-cli/tests/hostile_input.rs`).
# The test takes the files of the corpus and of the examples, changes them with a generator of
# pseudo-random numbers that always gives the same numbers for the same seed (cut, repeat a piece,
# change bytes, put extreme numbers, nest deeply) and gives every result to every reader. A reader
# may refuse a file; it may never panic and it may never take longer than the limit.
# Every line is required; a key that is not here is refused.

# The seed of the generator. Another seed tries other files; the same seed tries the same ones.
seed = 20240611

# How many changed files each reader gets (the files as they are are tried as well).
iterations = 200

# The largest changed file, in bytes. A longer one is cut.
max_input_bytes = 1048576

# The longest time one reader may take for one file, in seconds.
max_seconds_per_input = 30
