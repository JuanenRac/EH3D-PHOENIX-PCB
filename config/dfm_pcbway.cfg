# Capability profile of the standard rigid FR-4 service of PCBWay, for `phoenix check --dfm-profile
# pcbway <board>` (or `--dfm config/dfm_pcbway.cfg`).
#
# The figures are the PUBLIC, GUIDING numbers of the maker's capabilities page named in `source`.
# Such a page changes without notice, so read it again before ordering: this file only shows what
# the page said when it was read. Nothing checks the file against the maker, which is why verified
# stays false (PHOENIX-DFM-006 says so in the report). Edit a figure here, never in the program.
# Lengths are in nanometres (1 mm is 1000000); a line with 0 or a missing line is off.
#
# Where the page does not say it in the form of this file:
# * The standard column of the page gives no mask bridge, edge distance, hole spacing or via size;
#   those four lines use the figures of the "advanced" column of the same page for copper under
#   2 oz: bridge 4 mil, copper to the milled edge 0.25 mm, hole spacing of a via 11 mil.
#   Holes of drilled parts ask 16 mil (0.41 mm) apart.
# * min_via_diameter_nm is off: the page gives no via diameter, only the annular ring of the pad.
# * min_annular_ring_nm is the 6 mil of the standard column (the outer ring of a via asks 5 mil
#   for thin copper and more for thick copper).
# * The board size is the one for multilayer boards (560 x 1150 mm); one or two layers allow
#   600 x 1200 mm.
# * Nothing here sets a number of holes (the page gives none).

name = PCBWay standard rigid FR-4
source = https://www.pcbway.com/capabilities.html (public figures, standard and advanced columns, copper under 2 oz)
verified = false

# The limits of the usual rule check (they replace the rules of the board for this run).
min_track_width_nm = 100000
min_clearance_nm = 100000
min_drill_nm = 150000
min_via_diameter_nm = 0
min_annular_ring_nm = 150000
min_edge_clearance_nm = 250000
min_mask_bridge_nm = 101600
min_drill_spacing_nm = 279400
connect_tolerance_nm = 0
silkscreen_over_pads = true
silkscreen_over_mask_openings = false

# What the maker can build at all.
max_copper_layers = 14
min_board_short_nm = 3000000
min_board_long_nm = 3000000
max_board_short_nm = 560000000
max_board_long_nm = 1150000000
max_drill_nm = 6000000
max_holes = 0
