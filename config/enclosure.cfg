# Example of the file of an enclosure: `phoenix enclosure <board> --enclosure config/enclosure.cfg`.
# Copy it and write your own numbers. Every length is in millimetres, with up to six decimals, in
# the coordinates of the board.

# The inside of the box: the length along x, the width along y and the height from the floor to
# the lid.
box = 60x45x25

# Instead of the box, the inner contour of a DXF drawing that lies next to this file (the largest
# closed contour of the layer, or of every layer when no layer is named) and the inner height:
# contour = inner.dxf
# contour_layer = INNER
# height_mm = 25

# The thickness of the walls. The checks use the inside; the walls only give the outside size.
wall_mm = 2
# The height of the underside of the board above the floor: the height of the screw posts.
standoff_mm = 4
# Where the lower left corner of a box is (the box is centred on the board when these are left
# out); for a contour, how far it is moved (it is not moved when they are left out).
# x_mm = -5
# y_mm = -2.5
# The least distance that the board and the components keep from the walls, the lid and the
# floor; less than this is a warning, through the wall is an error.
min_clearance_mm = 0.5
# How far the centre of a hole of the board may be from the centre of a post.
post_hole_tolerance_mm = 0.3

# The screw posts, one line each: x, y, the diameter of the post and, if you like, the diameter of
# the hole that the screw needs in the board and the height of the top of the post above the
# underside of the board (the post reaches the underside when it is left out). At most 64.
post = 3.5, 3.5, 6, 3.2
post = 56.5, 3.5, 6, 3.2
post = 3.5, 41.5, 6, 3.2
post = 56.5, 41.5, 6, 3.2
