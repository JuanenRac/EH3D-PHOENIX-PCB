# Settings of the signal integrity estimates (`phoenix si`).
# Every line is optional; a missing line keeps the default shown here. The estimates are
# quasi-static and have not been compared with a field solver, a simulator or a measurement.

# The edge of the drivers: the rise time (a linear ramp), in picoseconds.
rise_time_ps = 500
# The values of a single net follow the pattern `<key>.<net>`, for example (leave commented out
# unless a net needs it):
# rise_time_ps.CLK = 200
# rs_ohm.CLK = 10
# rl_ohm.CLK = 50
# cl_pf.CLK = 2.5

# The driver and the load of every net: the output resistance of the driver in ohm, the resistance
# of the load to ground in ohm (0 is an open end) and the capacitance of the load in picofarad.
rs_ohm = 25
rl_ohm = 0
cl_pf = 5

# Crosstalk. Lengths are in nanometres.
# The widest gap between the edges of two tracks at which they still count as coupled.
coupling_range_nm = 1500000
# The shortest parallel run that is looked at.
min_parallel_nm = 1000000
# The largest angle between two pieces that still count as parallel, in degrees.
parallel_tolerance_deg = 1
# The near-end and far-end crosstalk, in percent of the step of the aggressor, from which a warning
# and an error are given (the far end is judged by its absolute value).
next_warn_pct = 5
next_error_pct = 10
fext_warn_pct = 5
fext_error_pct = 10
# The largest ratio of the mutual to the self inductance for which the weak-coupling formulas are
# trusted.
weak_coupling_limit = 0.3

# Reflections. The overshoot and the ringback are in percent of the final level.
overshoot_warn_pct = 10
overshoot_error_pct = 25
ringback_warn_pct = 10
# The band around the final level inside which the line counts as settled, in percent.
settle_band_pct = 5
# The steps the rise time is cut into, the delays of the line that are covered, the most steps of a
# simulation and the bounces listed in the diagram.
steps_per_rise = 20
delays_simulated = 40
max_steps = 400000
bounces = 8
# The time constant of the RC termination, in delays of the line.
rc_tau_over_td = 4
# The slowing of the rise time by the loss of the line from which a warning is given, in percent.
rise_degradation_warn_pct = 20

# The eye diagram: the bit rate in megabit per second, the order of the sequence (7 or 9), the
# samples of a bit, the order of the filter (1 or 2) and the height and width, as fractions, below
# which a warning is given (half of it is an error).
bit_rate_mbps = 100
prbs = 7
samples_per_ui = 32
eye_order = 1
eye_height_warn = 0.6
eye_width_warn = 0.6

# The return path. The distance between the points at which a track is looked at over its plane,
# the longest via stub that is accepted, the fraction of the rise time that the round trip of a
# stub may take, the delay of a via barrel in picoseconds per millimetre and the length of a via
# when the stack-up does not give it.
plane_sample_nm = 500000
max_stub_nm = 1500000
stub_tr_fraction = 0.1
via_delay_ps_per_mm = 6.9
default_via_length_nm = 1600000

# The line when there is no usable stack-up: the impedance in ohm, the effective permittivity, the
# height over the plane in nanometres, the relative permittivity and the loss tangent.
default_z0_ohm = 50
default_eps_eff = 3
default_h_nm = 200000
default_er = 4.3
default_tan_d = 0.02

# The most nets, and the most tracks, vias and pieces of track, a run handles.
max_nets = 2000
max_items = 200000
