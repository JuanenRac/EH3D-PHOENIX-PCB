# Settings of the RF structure generator (`phoenix rfgen ... --settings`).
# Every line is optional; a missing line keeps the default shown here.
# Lengths are in nanometres (_nm), impedances in ohm, angles in degrees.

# --- defaults of the structures ---
# The impedance of the lines when none is given.
default_z0_ohm = 50.0
# The electrical length of a line when none is given.
default_line_degrees = 90.0
# The length of the 50 ohm leads that join a structure to the rest of the board.
lead_length_nm = 3000000
# A mitered bend needs arms at least this many widths long.
miter_min_arm_over_width = 2.0
# The radius of a curved bend, in widths of the track. Below this a warning is given.
curve_radius_over_width = 3.0
# The electrical length of a width transition, in degrees at the mean guided wavelength.
taper_length_degrees = 20.0
# The electrical length of the main line that carries a stub.
stub_main_degrees = 90.0
# The impedance of the series line that stands for a series inductance in an L network.
lmatch_series_line_ohm = 100.0
# The longest series line of an L network, in degrees; a longer one is not a lumped element.
lmatch_max_series_degrees = 45.0

# --- vias ---
# The drill and the pad diameter of the vias (stub ends, via fence).
via_drill_nm = 300000
via_diameter_nm = 600000

# --- filters ---
# The impedances of the narrow (inductive) and the wide (capacitive) sections of the
# stepped-impedance low-pass filter.
lowpass_z_high_ohm = 120.0
lowpass_z_low_ohm = 20.0
# The gap that is kept between the open ends of resonators that face each other.
bandpass_end_gap_nm = 300000
# The fractional bandwidth of a band-pass filter when none is given, in percent.
bandpass_bandwidth_percent = 10.0
# The most sections a filter may have.
max_filter_order = 9
# The tolerance (ohm) and the most steps of the search for the width and gap of a coupled pair.
solver_tolerance_ohm = 0.001
solver_max_iterations = 100

# --- couplers ---
# The distance between the arms of a Wilkinson divider, centre to centre, in widths of an arm.
wilkinson_pitch_over_width = 3.0
# The gap between the output arms where the isolation resistor goes.
wilkinson_resistor_gap_nm = 1500000

# --- antennas ---
# The gap on each side of the feed line where it enters the patch (inset feed).
patch_notch_gap_nm = 500000
# The shortening of a printed dipole against a half wavelength in the substrate.
dipole_shortening = 0.95
# The width of the strips of a printed dipole, the gap at its feed point and the length of the feed.
dipole_strip_width_nm = 1500000
dipole_feed_gap_nm = 1000000
dipole_feed_length_nm = 8000000
# The steps of the numerical integral of the mutual conductance of a patch.
patch_integral_steps = 400

# --- SMA launch and via fence ---
# The width and the length of the signal pad, the width of the ground pads and the gap between the ground copper and the widest of the pad and the line.
sma_signal_pad_width_nm = 1500000
sma_pad_length_nm = 2500000
sma_ground_pad_width_nm = 2000000
sma_ground_gap_nm = 400000
# The spacing of the vias of the fence as a fraction of the guided wavelength (1/20 = 0.05).
fence_spacing_wavelengths = 0.05
# The copper margin around each via of the fence (the ground strip is a via diameter plus twice this wide).
fence_gap_nm = 400000

# --- the board ---
# Add a ground pour on the reference layer under the structure (the stack-up already assumes a plane).
ground_pour = false
# How far the ground pour goes beyond the structure.
ground_margin_nm = 5000000
# The clearance written into the zones that hold the copper shapes.
zone_clearance_nm = 200000
# A shape narrower than this raises a warning.
min_feature_nm = 100000

# --- the rule check of the result ---
# Refuse a result that adds an error to the rule check (true) or only report it (false).
rules_gate = true
rule_min_track_width_nm = 100000
rule_min_clearance_nm = 100000
rule_min_via_diameter_nm = 400000
rule_min_drill_nm = 200000
rule_min_annular_ring_nm = 100000
rule_min_edge_clearance_nm = 0
rule_min_drill_spacing_nm = 250000

# --- limits ---
# The most items one structure may have.
max_items = 100000
# How many ids are tried when a new part needs a free one.
id_attempts = 100000
