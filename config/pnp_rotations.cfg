# Settings of the pick and place files (`phoenix pnp`, `phoenix fabpack`).
# Every line is optional; a missing line keeps the default shown here.
# Lengths are in millimetres, angles in degrees.

# Where the coordinates start: lower_left (the lower left corner of the board outline), aux (the
# auxiliary origin below) or panel (the origin of a panel in which the lower left corner of the
# board is at panel_x_mm and panel_y_mm).
origin = lower_left
aux_x_mm = 0
aux_y_mm = 0
panel_x_mm = 0
panel_y_mm = 0

# The unit of X and Y (mm or mil) and the digits after the point of the coordinates and the rotation.
units = mm
decimals = 4
rotation_decimals = 2

# What the centre of a part is: body (the middle of the box of its pads), pads (the mean of the
# centres of its pads) or origin (the origin of its footprint).
centre = body

# How the rotation of a part on the bottom face is written: keep, mirror (360 minus the rotation)
# or half_turn (plus 180).
bottom_rotation = keep

# What is done with the parts that are not fitted: exclude (left out of the lines and listed in the
# JSON file) or mark (kept in the lines, with a Status column).
not_fitted = exclude

# The separator of the CSV files: comma, semicolon or tab.
delimiter = comma

# The extra rotation of the parts whose footprint name matches a pattern (`*` for any run of
# characters, `?` for one, any case), in degrees, for heads that hold a part turned. The first line
# that matches wins. Lines after `[name]` belong to a machine or maker, chosen with
# `--maker name`; they are tried before the lines above the first section.
# rotate = SOT23* 180
# rotate = QFN* 90
#
# [machine_a]
# rotate = SOT23* 270
