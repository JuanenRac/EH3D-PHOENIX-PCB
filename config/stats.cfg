# Settings of the statistics of a board (`phoenix stats`).
# Every line is optional; a missing line keeps the default shown here.

# The most objects (parts, tracks, vias, zones, connected pads and silkscreen items) that a
# board may hold for the report to be made. Between 1 and 100000000.
max_items = 1000000

# Count the area of the zones as copper: the whole outline less its cutouts, before the
# clearances are taken off, so it is an upper bound. With false the zones are counted but add no
# area to the copper of their layer.
count_zones = true
