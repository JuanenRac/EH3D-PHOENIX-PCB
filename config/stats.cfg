# Settings of the statistics of a board (`phoenix stats`).
# Every line is optional; a missing line keeps the default shown here.

# The most objects (parts, tracks, vias, zones, connected pads and silkscreen items) that a
# board may hold for the report to be made. Between 1 and 100000000.
max_items = 1000000

# Count the area of the zones as copper: the whole outline less its cutouts, before the
# clearances are taken off, so it is an upper bound. With false the zones are counted but add no
# area to the copper of their layer.
count_zones = true

# Compare the copper of the layers that mirror each other (the first with the last, the second
# with the one before the last, and so on): a board whose copper is uneven across the middle of
# the stack bends when it is heated.
balance_check = true
# The most that the coverage of two layers that mirror each other may differ, in hundredths of
# a percentage point (1500 is 15.00 points). Between 0 and 10000.
balance_max_difference_x100 = 1500
# How serious a pair above that limit is: info, warning or error. With error the command
# `phoenix stats` exits with 1.
balance_severity = warning
