# Capability profile of the standard service of NCAB, for `phoenix check --dfm-profile ncab <board>`
# (or `--dfm config/dfm_ncab.cfg`).
#
# The figures are PUBLIC numbers of the capability sheet of the maker. A sheet changes without
# notice, so read it again before ordering: this file only shows what it said when it was read.
# Nothing checks the file against the maker, which is why verified stays false (PHOENIX-DFM-006
# says so in the report). Edit a figure here, never in the program. Lengths are in nanometres
# (1 mm is 1000000); a line that is missing is off.
#
# Where one number cannot say what the sheet says:
# * the sheet gives track and space of 0.03 mm for inner layers and 0.05 mm for outer layers as
#   the standard; the profile uses the outer figure, because the rule check has one limit.
# * the sheet gives 0.1 mm for the mechanical drill and 0.075 mm for the laser; the profile uses
#   0.1 mm.
# * the thinnest two-layer board it names is 0.10 mm (0.074 mm in the finest case) and a board of
#   four or more layers 0.20 mm (0.18 mm); the profile gives no thickness because the sheet gives
#   no usual one.
# * impedance control is +-10 % (+-5 to 8 % on request); no line holds it.

name = NCAB standard
source = public figures of the capability sheet of the maker
verified = false

min_track_width_nm = 50000
min_clearance_nm = 50000
min_drill_nm = 100000
