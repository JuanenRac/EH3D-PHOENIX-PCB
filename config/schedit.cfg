# Settings of the schematic editor (`phoenix schedit ... --config`, and the schematic mode of the
# viewer window). Every line is optional; a missing line keeps the value shown here. This file is
# also the default that is built into the program. The viewer settings file does not hold these:
# it refuses keys it does not know.

# The grid that points snap to, in nanometres (2540000 = 2.54 mm, a tenth of an inch), and whether
# snapping is on.
grid_nm = 2540000
snap = true

# How far from a pin, a label or a wire a click still picks it or joins it, in nanometres, and the
# space added around the pins of a part to make the box that picks the part.
pick_tolerance_nm = 1270000
part_padding_nm = 1270000

# How far a pasted copy lies from the place of the copy when it is pasted without a target, and the
# distance between the labels of a bus, in nanometres.
paste_offset_nm = 2540000
bus_step_nm = 2540000

# How many steps can be undone.
history_limit = 1000

# Run the electrical rule check after every change.
live_erc = true

# A wire that has to turn a corner goes first along x (true) or first along y (false); the space key
# of the window changes it for the wire in progress.
wire_horizontal_first = true

# How many symbols the palette lists for a search.
palette_results = 50

# The sheet that is added to a schematic that has none: its name and its size in nanometres (an A4
# sheet, landscape).
new_sheet_name = Sheet 1
new_sheet_width_nm = 297000000
new_sheet_height_nm = 210000000
