# Settings of the filling of zones (`phoenix zones fill`, `phoenix zones check`).
# Every line is optional; a missing line keeps the default shown here. Lengths are in nanometres.

# The sides of the polygon that holds a circle (8 or 16). A circle is kept away from by a polygon
# around it, so the gap is never smaller than the rule and a little larger at the corners.
circle_sides = 16
# How far from exact the cut points and the shared borders may be. A cut point is rounded to the
# nearest nanometre; the check allows this much for it.
snap_tolerance_nm = 2

# An island narrower than this as a whole is dropped (the width of its convex hull).
min_width_nm = 150000
# An island with less area than this, in square nanometres, is dropped (0.1 square millimetre).
min_island_area_nm2 = 100000000000
# Keep the islands that touch no copper of the net (true or false).
keep_unconnected_islands = false

# How the zone joins a pad and a via of its own net: thermal, solid or none. A pad that is not
# joined is kept apart like copper of another net.
pad_connection = thermal
via_connection = solid

# The thermal relief: a gap ring around the pad with spokes across it.
# The width of the gap ring.
thermal_gap_nm = 250000
# The width of each spoke.
thermal_spoke_width_nm = 250000
# The number of spokes: 4 (up, down, left, right) or 2 (left and right).
thermal_spokes = 4
# The inner radius of the ring is the radius of the smallest circle around the pad, and at least this.
thermal_inner_radius_nm = 0
# The outer radius of the ring is the inner radius plus the gap, and at least this.
thermal_outer_radius_nm = 0

# The largest angle one piece of an arc spans when an arc is kept away from, in whole degrees.
arc_piece_degrees = 10
# The most pieces one zone may be cut into before the fill gives up on it.
max_fragments = 200000
# The most points in the outline of a zone.
max_outline_points = 10000
