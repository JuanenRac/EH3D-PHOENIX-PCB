# Settings of the printing (`phoenix print`).
# Every line is optional; a missing line keeps the default shown here. A line that starts with
# `#` is a comment. Lengths are in millimetres. Colours are #rrggbb or #rrggbbaa (the last two
# digits are the opacity: ff is solid, 80 is half transparent).

# The paper: A4, A3, Letter or WIDTHxHEIGHT in millimetres (for example 400x300).
paper = A4

# How the paper is turned: auto (landscape when the drawing is wider than it is tall),
# landscape or portrait.
orientation = auto

# The margin between the edge of the paper and the border.
margin_mm = 10

# The scale, paper over design: auto, 1:2 (half size), 2:1 (double size) or a number such as 0.5.
# With auto, scale_rounding says how it is chosen: nice (the largest of the usual scales that
# fits) or exact (the scale that fills the paper).
scale = auto
scale_rounding = nice

# The widths of the lines: the border, the title block with the dimensions, and the thinnest line.
frame_line_mm = 0.5
title_line_mm = 0.25
thin_line_mm = 0.1

# The title block, in the lower right corner: its size and the size of its texts. min_text_mm is
# the smallest size of a font in the drawing itself.
title_width_mm = 150
title_height_mm = 24
title_text_mm = 3.2
label_text_mm = 2
min_text_mm = 1

# The fonts: helvetica or courier (the standard fonts of a PDF reader).
font_title = helvetica
font_labels = helvetica

# The texts of the title block. An empty project takes the name of the document.
project =
revision =
author =

# The scale bar and the dimension lines of the width and the height.
scale_bar = true
dimensions = false

# The side of a board that is printed: top, bottom or both.
side = both

# The layers that are printed: all, or names separated by commas (the names of the colours
# below, without `colour_`). The border and the dimensions are always printed.
layers = all

# The colours. The paper, then one for each kind of layer.
colour_background = #ffffffff
colour_frame = #202020ff
colour_dimensions = #202020ff
colour_documentation = #808080ff
colour_top_copper = #c03030b0
colour_bottom_copper = #3050c0b0
colour_inner_copper = #30905080
colour_mask = #20804050
colour_paste = #90909080
colour_silk_top = #101010ff
colour_silk_bottom = #604010ff
colour_designator = #101010ff
colour_outline = #000000ff
colour_drill = #000000ff
colour_assembly = #303030ff
colour_pin1 = #c00000ff
colour_fiducial = #0060a0ff
colour_sheet = #303030ff
colour_wire = #006000ff
colour_junction = #006000ff
colour_bus = #000090ff
colour_symbol = #800000ff
colour_pin = #800000ff
colour_label = #101010ff
colour_port = #600060ff
colour_panel_frame = #4a5568ff
colour_panel_boards = #2f8f5b60
colour_panel_outline = #202020ff
colour_panel_tabs = #c09010ff
colour_panel_vscore = #c02020ff
colour_panel_mouse_bites = #d07010ff
colour_panel_fiducials = #0080b0ff
colour_panel_tooling = #7040b0ff
colour_panel_holes = #101820ff
