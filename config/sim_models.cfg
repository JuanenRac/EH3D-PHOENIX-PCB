# Which simulation model each part of a schematic gets (`phoenix netlist`, `phoenix sim
# --schematic`; give another table with --models FILE). This text is also the built-in table.
#
# Lines (blank lines and what follows a # are ignored):
#   refdes PREFIX = DEVICE [options]   the parts whose reference designator starts with PREFIX and
#                                      then a digit or a sign, not a letter (R matches R1, not RV1);
#                                      the longest prefix wins
#   value  TEXT   = DEVICE [options]   the parts with that value, in any case; a * at the end
#                                      stands for any ending (BC557* matches BC557B)
#   symbol NAME   = DEVICE [options]   the parts whose symbol has that name (same use of *)
#   attr   REFDES KEY = TEXT           an attribute of one part; it beats every rule. The keys are
#                                      SIM.DEVICE, SIM.VALUE, SPICE_MODEL, SIM.FILE, SIM.PINS
#                                      and SIM.TOL (such as 5%)
#   .model NAME TYPE(PARAMS)           a model, written to the netlist when a part uses it
#   upper_m_is_mega = true|false       a capital M in a value means mega (2M2 is 2.2 mega, as on
#                                      the marking of a resistor); false reads it as SPICE does
# A value rule beats a symbol rule, which beats a prefix rule.
#
# Devices: resistor capacitor inductor vsource isource diode led zener npn pnp nmos pmos switch
#          opamp comparator subckt ammeter voltmeter skip
# Options: model=NAME  file=NAME.lib (a file in the folder of the netlist)  subckt=NAME
#          pins=A,K (the pins of the symbol in the order the device takes them: diode anode and
#          cathode; transistor collector, base and emitter, or drain, gate, source and bulk;
#          op-amp non-inverting input, inverting input and output; switch the two switched pins and
#          then the positive and the negative control pin)  w=10u l=1u (a MOSFET)
#          tol=5% (a resistor, a capacitor or an inductor: the tolerance it has in a Monte Carlo
#          study, `phoenix sim --mc`; a rule with no tol= leaves the part exact)
#
# Pins are matched by their names first (A and K, C B E, D G S, IN+ IN- OUT) and by their order
# otherwise. A part whose value names no model gets the generic model of the settings
# (config/sim.cfg) under that name, and the report says so. The values below are generic and are
# not the data of any part: put the model of your part in a .model line or in a file.

upper_m_is_mega = true

# two-terminal parts and sources
refdes R = resistor
refdes C = capacitor
refdes L = inductor
refdes V = vsource
refdes I = isource
refdes AM = ammeter
refdes VM = voltmeter

# semiconductors
refdes D = diode
refdes LED = led
refdes Q = npn
refdes M = nmos
refdes SW = switch

# parts that are not part of the circuit
refdes TP = skip
refdes FID = skip
refdes MH = skip

# generic models, used by the parts whose value names no other model
.model diode_generic D
.model led_generic LED
.model npn_generic NPN
.model pnp_generic PNP
.model nmos_generic NMOS
.model pmos_generic PMOS
.model switch_generic SW
.model opamp_generic OPAMP
.model comparator_generic COMP

# examples of the other kinds of lines (remove the # to use them). A Zener diode needs a model
# with its breakdown voltage, and the U parts are left out on purpose: an integrated circuit is
# not an op-amp unless the table says so.
# refdes DZ = zener model=dz5v1
# .model dz5v1 ZENER(BV=5.1)
# refdes U = opamp
# value BC557* = pnp
# symbol PMOS* = pmos
# value LM393 = comparator
# value 74HC04 = subckt file=hc04.lib subckt=HC04 pins=1,2,7,14
