# The roles of the user layers (100 to 255) of EAGLE files, read by `phoenix eagle-check` and by
# `phoenix eagle-convert`. The standard layers (1 to 99) have their roles from the table and
# cannot be changed here. A user layer with no line is kept in the file and is not exported.
#
# By number:   layer.<number> = <role>
# By name:     name.<Name> = <role>   (the name the layer has in the file; used when the number
#              has no line)
#
# The roles: copper, pads, vias, ratsnest, outline, silk_top, silk_bottom, origins_top,
# origins_bottom, names_top, names_bottom, values_top, values_bottom, mask_top, mask_bottom,
# paste_top, paste_bottom, finish_top, finish_bottom, glue_top, glue_bottom, test_top,
# test_bottom, keepout_top, keepout_bottom, restrict_top, restrict_bottom, restrict_via, drill,
# hole, milling, measures, document, reference, dxf, docu_top, docu_bottom, ground_top,
# ground_bottom, schematic_nets, schematic_busses, schematic_pins, schematic_symbols,
# schematic_names, schematic_values, schematic_info, schematic_guide, spice_order, user.
#
# Examples (leave commented out unless a board needs them):
# layer.100 = silk_top
# layer.101 = outline
# name.Milling2 = milling
