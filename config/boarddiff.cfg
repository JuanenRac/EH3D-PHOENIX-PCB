# Settings of the comparison of two boards (`phoenix boarddiff`).
# Every line is optional; a missing line keeps the default shown here. A list is words separated
# by commas.

# A part that moved by no more than this, in nanometres, has not moved. A turn or a change of side
# is always a difference.
move_tolerance_nm = 1000
# The copper of a net on a layer whose length changed by no more than this, in nanometres, and
# whose number of tracks is the same, has not changed.
length_tolerance_nm = 1000

# Which kinds of object are compared: true or false.
compare_pins = true
compare_tracks = true
compare_vias = true
compare_zones = true
compare_outline = true

# References of parts that are left out of the comparison (any case); a word that ends in * matches
# every reference that starts with the rest, for example TP*, FID*.
ignore_parts =
# Names of nets that are left out, with the same rule, for example N$*.
ignore_nets =

# The most objects (parts, pins, tracks, vias and zones) a board may hold for the comparison to
# run (1 to 100000000).
max_items = 1000000
# The most differences a report lists; the rest are counted (1 to 1000000).
max_differences = 1000

# Whether a cell of the CSV file (`--csv`) that a spreadsheet would read as a formula, such as a
# net called +5V, gets a quote mark in front: true or false.
csv_guard_formulas = true
