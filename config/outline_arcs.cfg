# How an arc in the outline of a board is cut into straight pieces when a check, the pour of a zone
# or the router needs a polygon (`Board::outline_polygon`). Every line is optional; a missing line
# keeps the default shown here.

# The most a straight piece may be from its arc, in nanometres. From 1 to 1000000.
tolerance_nm = 1000
# The most pieces one arc is cut into, whatever the tolerance. From 1 to 65536.
max_pieces = 1024
