# Settings of the server mode (`phoenix server`): a board is sent to EH3D-SERVER as a job of its
# plugin `pcb` and the report of the station is read back. Every line is optional; a missing line
# keeps the default shown here. Nothing is sent unless allow_network is true and the command is
# given --send; without --send the command only shows the request.

# The link, with the keys and the ranges of the client that every program of the suite uses.
# host:port of EH3D-SERVER; empty means there is no server.
server_address =
# The token of this program, made on the server for the scope jobs:prepare and jobs:start. Keep
# this file private when it holds a token: the program never prints it.
server_token =
# The id of the board station (a machine of the plugin pcb) the jobs are for.
server_machine =
# How long a request may take, in seconds (1 to 120).
server_timeout_s = 15
# How many more times a request that failed on the network is tried (0 to 5).
server_retries = 2
# Look for the server on the local network: on or off. The program has no resolver of its own.
server_mdns = off
# The most MiB read from one answer (1 to 256).
server_max_answer_mib = 8

# Whether the command may send anything over the network: true or false.
allow_network = false
# Whether the job is started after it is made: true or false. A job that is not started waits in
# the queue of the server until a person starts it.
start_job = true
# The pause between two questions about the job, in milliseconds (10 to 60000).
poll_ms = 300
# How many times the job is asked about before it is stopped and given up (1 to 100000).
max_polls = 400
# The most items (tracks, gaps, holes, parts or measurements) a request may hold (1 to 200000).
max_items = 50000

# The gaps between copper of different nets that a rules request lists, the smallest first.
# The most gaps listed (0 lists none, up to 10000).
clearance_max = 200
# A gap is listed only when it is smaller than this, in nanometres.
clearance_below_nm = 1000000
# A board with more tracks than this lists no gaps (0 to 100000).
clearance_max_tracks = 3000
# The most pieces of two tracks that are compared to make the gaps (1 to 1000000000).
clearance_pair_budget = 4000000

# Rules put over the ones of the station, in nanometres; 0 leaves the rule of the station.
rule_min_track_nm = 0
rule_min_gap_nm = 0
rule_min_drill_nm = 0
rule_max_drill_nm = 0
rule_min_edge_nm = 0

# The most problems a report lists (1 to 10000).
max_listed = 100

# The most MiB of a file that is saved to the project store of the server (1 to 256).
project_max_mib = 16
