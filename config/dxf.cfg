# Settings of the DXF reader and writer (`phoenix dxf-import`, `phoenix dxf-export`).
# Every line is optional; a missing line keeps the default shown here.
# Lengths are in nanometres.

# The names of the layers that `phoenix dxf-export` writes. They must differ from each other
# (without regard to case) and may not hold < > / \ " : ; ? * | = ` or a comma.
layer_outline = OUTLINE
layer_drills = DRILLS
layer_pads = PADS
layer_silk = SILKSCREEN
layer_vscore = VSCORE
layer_fiducials = FIDUCIALS
layer_tabs = TABS
layer_tooling = TOOLING
layer_mouse_bites = MOUSEBITES
layer_text = TEXT

# Write the name of each board as a text on the text layer (true or false), and its height.
write_text = false
text_height_nm = 1000000
# The length of an arm of the cross that marks a point.
cross_size_nm = 1000000

# How far apart two ends of lines and arcs may be and still be joined into one chain.
join_tolerance_nm = 10000
# How far a straight piece may be from the spline or the arc that it replaces.
spline_tolerance_nm = 5000
arc_tolerance_nm = 5000
# The unit of a drawing that does not say which it is: mm or inch.
default_unit = mm

# The limits of the reader: the largest file in bytes, the most entities once the blocks are
# expanded, how deep blocks may hold blocks, the most blocks, the most points of a spline, the
# most findings listed (the rest are counted) and the most edges of a contour that are checked
# for crossings.
max_file_bytes = 16777216
max_entities = 500000
max_block_depth = 8
max_blocks = 10000
max_spline_points = 10000
max_findings = 1000
max_check_edges = 4000
# The most closed contours that are put in order by containment (the work grows with the square
# of the number); with more the outline is refused with PHOENIX-DXF-002.
max_contours = 5000
