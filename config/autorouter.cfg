# Settings of the external autorouter (`phoenix autoroute run`).
# Every line is optional; a missing line keeps the default shown here.
#
# The adapter is OFF. Nothing is started until `enabled = true` here AND the command is given
# `--execute`. It starts the program directly (no shell), with an empty environment, in a new
# folder inside temp_dir, and ends it when timeout_s has passed. It opens no network connection
# and accepts no address in these settings. Keep no secret here.

# The safety switch.
enabled = false

# The absolute path of the autorouter program (required when enabled).
executable =

# One argument per `arg` line, in order. {dsn} stands for the design file the adapter writes and
# {ses} for the session file the program must write. Both must appear.
# Example for a program that takes the design and the session as options:
#   arg = -de
#   arg = {dsn}
#   arg = -do
#   arg = {ses}

# How long the program may run, in seconds (1 to 86400).
timeout_s = 600

# The absolute path of an existing folder; each run makes a folder of its own inside it.
temp_dir =

# Keep the folder of the run (design, session, output of the program) after the run.
keep_temp = false

# The largest session that is read, in bytes.
max_session_bytes = 67108864

# Names of environment variables passed to the program, one per `env` line (for example the ones a
# Windows program needs to start). A name that suggests a secret (key, token, secret, pass,
# credential, auth) is refused.
#   env = SystemRoot
