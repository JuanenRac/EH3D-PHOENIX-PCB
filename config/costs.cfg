# Settings of the bill of materials with costs (`phoenix bom`).
# Every line is optional; a missing line keeps the default shown here.
#
# THESE NUMBERS ARE AN EXAMPLE of the shape of a tariff. They are not the prices of any board
# maker or part supplier: copy this file, put the tariff you were quoted in it and pass it with
# --config. Money and percentages are decimals with at most six decimals.

# The currency of every price and cost. A price in another currency is ignored (and reported).
currency = EUR
# The number of boards of the batch (the --boards option wins).
boards = 10
# The extra parts bought for waste, in per cent of the quantity of the batch.
parts_waste_percent = 5

# The cost of the boards. The area of the outline is divided by the part of the panel that holds
# boards, and priced by the number of copper layers.
# The fixed cost of an order of boards.
pcb_setup_cost = 20
# The price of a square centimetre of board, by the number of copper layers. A board with a
# number of layers that has no line here cannot be costed (a finding says so).
pcb_area_rate.1 = 0.04
pcb_area_rate.2 = 0.06
pcb_area_rate.4 = 0.15
pcb_area_rate.6 = 0.26
# The part of the panel that holds boards, in per cent.
pcb_utilisation_percent = 80
# A board thicker than this costs more (it applies only when a stack-up gives the thickness).
pcb_thickness_reference_nm = 1600000
pcb_thickness_surcharge_percent = 20
# The cost of each drilled hole (vias and through-hole pads).
pcb_drill_cost = 0.001
# The least an order of boards costs.
pcb_min_order_cost = 5

# What makes two parts one line of the bill. The value and the footprint always do; add the maker
# and the part number to keep parts of different makers or numbers apart, or leave them out to
# join them (the line then has neither, and its prices are looked up by value and footprint).
group_by = value,footprint,manufacturer,mpn
# The columns of the CSV file, in this order. Any of: references, quantity, value, footprint,
# manufacturer, mpn, supplier, supplier_code, unit_price, price_break, quantity_to_buy,
# line_cost_batch, line_cost_per_board, price_breaks, status.
csv_columns = references,quantity,value,footprint,manufacturer,mpn,supplier,supplier_code,unit_price,price_break,quantity_to_buy,line_cost_batch,line_cost_per_board,price_breaks,status

# The most components, lines and price rows a run handles, and the largest input file in bytes.
max_items = 100000
max_file_bytes = 16777216
