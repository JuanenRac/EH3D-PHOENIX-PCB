# Colours of the roles of the prisms in the GLB file of the 3D export (profile phoenix-board-glb/1).
# One line for each role: material.<role> = red green blue alpha, each from 0 to 1. The role of a
# prism is told by the start of its name (copper, mask, silk, dielectric, board); any other name is
# the role part, which must be given. A colour is for looking at, not a statement of the real colour
# of a laminate or a mask.
material.board = 0.10 0.35 0.18 1.0
material.copper = 0.72 0.45 0.20 1.0
material.mask = 0.05 0.40 0.15 0.85
material.silk = 0.95 0.95 0.95 1.0
material.dielectric = 0.80 0.72 0.45 1.0
material.part = 0.15 0.15 0.15 1.0
