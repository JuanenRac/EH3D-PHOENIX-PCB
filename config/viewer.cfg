# Settings of the viewer (`phoenix view ... --settings`).
# Every line is optional; a missing line keeps the default shown here.

# The largest board or schematic file that is read, in bytes.
max_file_bytes = 268435456
# The most drawing primitives of one scene; a larger file is refused.
max_primitives = 4000000
# The smallest and the largest zoom, in pixels per millimetre.
zoom_min_px_per_mm = 0.05
zoom_max_px_per_mm = 4000.0
# How fast the wheel zooms: the zoom is multiplied by exp(scroll * this).
zoom_wheel_rate = 0.0015
# The free space around the drawing when it is fitted to the window, as a fraction of each side.
fit_margin_fraction = 0.05
# How far from an item a click still selects it, in pixels.
pick_tolerance_px = 5.0
# The error allowed when an arc is drawn as short lines, in pixels.
arc_max_error_px = 0.3
# The fewest and the most lines an arc is drawn with.
arc_min_segments = 6
arc_max_segments = 256
# A filled polygon with more points than this is drawn as its outline only.
max_fill_points = 2000
# The width of the board outline and of the lines of a symbol, in millimetres.
outline_width_mm = 0.1
symbol_line_width_mm = 0.2
wire_width_mm = 0.15
# The height of the reference designators of the board, in millimetres.
designator_height_mm = 1.0
# The text of a schematic: height of a label and of a pin number, in millimetres.
label_height_mm = 1.2
pin_number_height_mm = 0.8
# The radius of a pin of a symbol and the space around the pins of a symbol, in millimetres.
pin_radius_mm = 0.4
symbol_padding_mm = 2.54
# The gap between two sheets of a schematic laid side by side, in millimetres.
sheet_gap_mm = 20.0
# Text smaller than this on the screen is not drawn, in pixels.
text_min_px = 5.0
# The spatial index: primitives per cell, cells per primitive and cells in all.
grid_target_per_cell = 4.0
grid_max_cells_per_prim = 64
grid_max_cells = 1000000
# The benchmark (`phoenix view --bench`): the sizes of the three boards in primitives, the picks
# made on each (and how many of them also by a scan of every primitive), the pitch of the generated
# copper in millimetres, how far from an item a pick still hits it and the seed of the generator.
bench_small = 1000
bench_medium = 20000
bench_large = 200000
bench_picks = 2000
bench_linear_picks = 200
bench_pitch_mm = 0.4
bench_pick_tolerance_mm = 0.25
bench_seed = 1
# Editing: the grid that positions snap to (millimetres), the turn of one rotation (degrees), how
# far from a vertex of a track a press takes it (pixels), the step of the keys plus and minus on
# the width of a track (millimetres), the width of the ratsnest lines (pixels), the radius of the
# ring that marks a finding (pixels), the most findings a panel lists and the ending of the copy
# that is made before a file that was saved before is replaced, and, for the start screen of the
# window, how many recent files it keeps and the name of the file that holds them (in the settings
# folder of the user).
snap_mm = 0.05
rotate_step_deg = 90.0
vertex_pick_px = 8.0
width_step_mm = 0.05
ratsnest_width_px = 1.0
marker_radius_px = 14.0
findings_shown = 500
backup_suffix = .bak
recent_max = 10
recent_file = recent.cfg
# The imported Gerber layers shown in the window: the sides of a circle (apertures, ends of lines,
# holes), the angle of one piece of an arc (degrees), the most polygons of a set, the width given
# to a line that has none (millimetres), the opacity a layer starts with (above 0, up to 1), the
# side of a cell of the comparison with the board (millimetres) and the most cells of it, and how
# far from a corner or a centre a click of the measure still snaps to it (pixels).
gerber_circle_segments = 32
gerber_arc_step_deg = 6.0
gerber_max_polys = 2000000
gerber_hairline_mm = 0.02
gerber_default_opacity = 1.0
gerber_compare_cell_mm = 0.05
gerber_compare_max_cells = 4000000
gerber_snap_px = 8.0
# The 3D window of the assembled board: the field of view and the start of the camera (degrees),
# the turn for each pixel of the pointer (degrees), the speed of the pan (1 follows the pointer),
# the wheel (the distance is multiplied by exp(-scroll * this)), the closest distance of the camera
# (millimetres), the highest rise of the camera (below 90 degrees), the factor that heights are
# multiplied by when drawn, and the room the first view leaves around the scene.
view3d_fov_deg = 40.0
view3d_start_yaw_deg = 35.0
view3d_start_pitch_deg = 35.0
view3d_rotate_deg_per_px = 0.4
view3d_pan_speed = 1.0
view3d_zoom_wheel_rate = 0.0015
view3d_min_distance_mm = 5.0
view3d_max_pitch_deg = 89.0
view3d_height_scale = 1.0
view3d_fit_factor = 1.15
# The colours of the layers and of the marks: #rrggbb or #rrggbbaa.
colour.background = #0f0d0b
colour.top_copper = #c8a33c
colour.bottom_copper = #3c78c8
colour.inner_copper_1 = #3cc86e
colour.inner_copper_2 = #b43cc8
colour.inner_copper_3 = #c8643c
colour.inner_copper_4 = #3cc8c8
colour.mask = #2ca02c46
colour.paste = #b0b0b05a
colour.silk_top = #f4ece0
colour.silk_bottom = #9c8d7a
colour.outline = #4dd0e1
colour.drill = #101010
colour.documentation = #9c8d7a
colour.designator = #f4ece0
colour.sheet = #9c8d7a
colour.symbol = #e0b04c
colour.wire = #9be34a
colour.pin = #e8e8f0
colour.label = #f4ece0
colour.highlight = #ff5470
colour.measure = #ffb000
colour.ratsnest = #e8e8f0b4
colour.gerber_drill_plated = #e8e8f0
colour.gerber_drill_unplated = #ff8c42
colour.gerber_only_files = #ff5470e6
colour.gerber_only_board = #4dd0e1e6
colour.view3d_board = #1f6f45
colour.view3d_top_part = #6b7f95
colour.view3d_bottom_part = #956b7f
colour.view3d_collision = #ff5470
colour.view3d_too_tall = #ffb000
colour.view3d_outside = #b43cc8
colour.view3d_selected = #f4ece0
