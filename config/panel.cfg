# Settings of the panel (`phoenix panel`).
# Every line is optional; a missing line keeps the default shown here.
# Lengths are in nanometres (1 mm is 1000000).

# The matrix: boards across and up.
columns = 2
rows = 2

# The routed gap between two boards, and between a board and the frame. With joint = v_score the
# boards touch and this value is ignored.
gap_nm = 2000000

# The frame: none, top_bottom (a rail above and below), left_right or all.
frame = all
frame_width_nm = 8000000

# How the boards are separated: mouse_bites (tabs across the gap with a row of small holes) or
# v_score (a V groove along each line between boards).
joint = mouse_bites

# The tabs: the width of one along the edge and how many on each edge that has a neighbour.
tab_width_nm = 3000000
tabs_per_edge = 2

# The mouse bite holes of one tab: diameter, distance between centres and how many.
mouse_bite_drill_nm = 500000
mouse_bite_pitch_nm = 800000
mouse_bite_holes = 3

# The fiducials of the frame: copper diameter, solder mask opening, how many (0, 3 or 4), the
# distance from the tooling hole of the corner along the rail and whether the bottom side has them.
fiducial_diameter_nm = 1000000
fiducial_mask_diameter_nm = 2000000
fiducial_count = 3
fiducial_step_nm = 12000000
fiducials_both_sides = false

# The tooling holes of the frame: diameter, how many (0, 2, 3 or 4) and the distance of the centre
# from the two edges of the corner.
tooling_hole_diameter_nm = 3000000
tooling_hole_count = 4
tooling_hole_margin_nm = 4000000

# The width of the line that draws the outline and the V-score lines in the Gerber files.
outline_width_nm = 100000

# The limits: the most boards and the largest side of the panel.
max_boards = 400
max_panel_nm = 600000000
