# Settings of the spatial index that makes the checks of a board fast (the clearance check of
# `phoenix check`, the ratsnest and the report of `phoenix perf`). This file is also the default
# that is built into the program. A line that is left out keeps the value shown here; a key the
# program does not know, a key written twice and a value out of range are refused with the code
# PHOENIX-SPATIAL-001.
#
# The index only chooses which items are compared. It changes the speed and never the result.

# The size of a cell of the grid, in nanometres. 0 chooses it from the boxes of the items.
cell_nm = 0

# The most entries (one for each cell that an item covers) the grid may hold. A board that would
# need more is refused by `phoenix perf` with PHOENIX-SPATIAL-002; the checks then compare every
# pair, which gives the same result more slowly.
max_cells = 4000000

# An item that covers more cells than this is kept in a short list that every query looks at.
max_cells_per_item = 4096

# The most items one index accepts (PHOENIX-SPATIAL-003).
max_items = 4000000
