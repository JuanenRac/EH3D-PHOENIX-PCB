# Settings of the KiCad readers (`phoenix kicad-read ... --settings`).
# Every line is optional; a missing line keeps the default shown here.

# The largest file that is read, in bytes.
max_file_bytes = 134217728
# The deepest nesting of lists in an s-expression file.
max_depth = 64
# The most nodes (atoms, strings and lists) an s-expression file may have.
max_nodes = 5000000
# The longest atom or quoted string, in bytes.
max_string_bytes = 1048576
# The most items of one kind (tracks, wires, pads, ...) that are read from a file.
max_items = 2000000
# The most sheets read through a hierarchy, and the deepest nesting of sheets.
max_sheets = 256
max_sheet_depth = 8
# The most diagnostics kept for a file; the rest are counted in one last note.
max_diagnostics = 1000
# The oldest and the newest file version (the number after `version`) that the tests cover.
min_tested_version = 20211014
max_tested_version = 20251231
# The largest project file (.kicad_pro) that is read, in bytes.
max_project_bytes = 4194304
# The straight pieces that replace a quarter turn of an arc of the board outline.
outline_arc_steps_per_quarter = 8
# The most point-in-polygon tests (corners of a rule area times edges of a zone) made while
# the rule areas that keep the pour out are given to the zones; the areas left over are reported.
max_keepout_checks = 100000000
# The most closed rings of the board outline (the outline and its openings) that are kept; the
# rings left over are reported and not tested for lying inside the outline.
max_outline_rings = 10000
