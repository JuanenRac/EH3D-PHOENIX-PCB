# Settings of the hierarchy of sheets (`phoenix hier`, and the netlist and the rule check of a
# schematic that has sheet symbols). Every line is optional; a missing line keeps the value shown
# here. This file is also the default that is built into the program.

# How the reference of a part in a repeated or nested sheet is made from the name of the sheet
# symbol (the instance) and the reference on the sheet. `prefix` gives U1/R1 (the instance first),
# `suffix` gives R1_U1 with the separator below.
refdes_style = prefix
refdes_separator = /

# The separator of the names of the nets: /U1/VOUT is the net VOUT of the sheet symbol U1, and
# /VOUT a net of the top sheet.
net_separator = /

# true: a net label belongs to its own sheet (the same name on two sheets, or on two instances of
# one sheet, makes two nets). false: every label is global, as in a schematic without sheet
# symbols. Power ports are always global.
local_labels = true

# Net names that are global even when they are written as labels (a comma-separated list).
global_nets = GND,VCC,VDD,VSS,VBUS,+5V,+3V3,+1V8,+12V

# The deepest nesting of sheet symbols, and the most instances of sheets that are expanded.
max_depth = 16
max_instances = 4096
