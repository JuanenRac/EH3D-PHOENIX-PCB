# Settings of the synchronisation between a schematic and a board (`phoenix sync ... --config`).
# Every line is optional; a missing line keeps the value shown here. This file is also the default
# that is built into the program.

# Where the first new component is put on the board when the schematic has a part that the board
# does not have yet, and how far apart the next ones are put along X (nanometres, 5000000 = 5 mm).
# The person who lays out the board moves them; the point is only that they do not lie on each
# other.
new_part_x_nm = 0
new_part_y_nm = 0
new_part_step_nm = 5000000

# The side of the board a new component is put on: top or bottom.
new_part_side = top

# A component of the board whose part is no longer in the schematic: false lists it and keeps it,
# true removes it (the change can be undone).
remove_missing_components = false

# A net of the schematic with no net of the same name on the board, whose pads all sit on one net
# of the board that no schematic net claims: true renames that net, false makes a new net and moves
# the pads (the tracks stay on the old net).
rename_nets = true

# When a result is written to a file the command writes a temporary file and renames it; on a
# system that holds the file for a moment the rename is tried again this many times, this many
# milliseconds apart.
write_retries = 5
write_retry_ms = 50

# The footprint that the board uses is written back into a part of the schematic (backward
# annotation), also for a part that has none chosen yet.
backward_footprints = true
