# Settings of the bill of materials written for an assembler (`phoenix bom --assembler`).
# Every line is optional; a missing line keeps the default shown here.
#
# The two formats below are written from the headers that the author knows those assemblers ask
# for. They have never been sent to an assembler and are not verified: compare them with the
# template that your assembler gives you and change the lines here.

# A format is `format.NAME = Header=field|Header=field|...`: the name is 1 to 32 lower case
# letters, digits, `_` or `-`; each column has the header that the assembler wants (it cannot
# hold `=` or `|`) and the field of the bill that fills it. The fields are:
#   item           the number of the line, from 1
#   references     the references of the line, joined by references_separator
#   quantity       the number of parts of the line in one board
#   value          the value
#   footprint      the name of the footprint
#   manufacturer   the maker
#   mpn            the part number of the maker
#   supplier       the supplier of the offer that was chosen (empty without a price)
#   supplier_code  the code of the part at that supplier
#   matched_code   the same code, only when the supplier is the one of code_supplier
#   blank          an empty cell, for a column that the assembler asks for and the bill lacks
# A line with the name of a format that exists replaces it; a new name adds a format.
format.jlcpcb = Comment=value|Designator=references|Footprint=footprint|LCSC Part #=matched_code
format.pcbway = Item #=item|Designator=references|Qty=quantity|Manufacturer=manufacturer|Mfg Part #=mpn|Description / Value=value|Package/Footprint=footprint

# The character between the cells: comma, semicolon or tab.
delimiter = comma
# The character between the references of one cell: comma, semicolon, space or tab.
references_separator = comma
# The supplier whose code the field matched_code writes (compared without regard to case); empty
# for the code of any supplier.
code_supplier = LCSC
