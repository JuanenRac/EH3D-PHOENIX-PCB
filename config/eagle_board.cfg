# Limits of the readers of EAGLE board and schematic files.
# Every line is optional; a missing line keeps the default shown here. Each is a whole number from
# 1 to 1000000000000. What goes over a limit is not read and a PHOENIX-EAGLE-022 note names the limit.

# The most closed rings of the outline layer (the outline and its openings) that are kept and
# tested for lying inside the largest one.
max_outline_rings = 10000
# The most point-in-polygon tests (points of a restrict area times points of a pour) made while the
# restrict areas are given to the pours.
max_restrict_checks = 100000000
# The most tests of an end of a net against a wire of a bus made while the entries of the buses of a
# schematic are found.
max_bus_checks = 100000000
