# Settings of the IPC-2581 writer (`phoenix ipc2581`).
# Every line is optional; a missing line keeps the default shown here.

# The date and time of the history record of the file, as YYYY-MM-DDTHH:MM:SS. It is a setting
# and not the clock so that the same board always gives the same file; change it when the file
# should carry the date of the release.
origination = 1970-01-01T00:00:00

# Write the bill of materials: the parts grouped by value and footprint.
include_bom = true
# Write the tracks.
include_tracks = true
# Write the zones, as their outlines (the copper fill is not written).
include_zones = true
# Write the lines of the dimensions (extension lines, dimension lines, arrow heads and arcs) on a
# layer of the function DOCUMENT.
include_dimensions = true
# Write the texts of the dimensions (their measures) on that layer too. Without include_dimensions
# nothing of the dimensions is written.
include_dimension_texts = true
# The height of those texts, in nanometres; 0 keeps the height each dimension has. Between 0 and
# 1000000000.
dimension_text_height_nm = 0

# The most objects (parts, connected pads, tracks, vias and zones) that a board may hold for the
# file to be made. Between 1 and 100000000.
max_items = 1000000

# The IPC-D-356A netlist that `phoenix ipc2581 --d356 FILE` writes beside the IPC-2581 file. Write
# the pads without a hole (the surface pads) as well as the pads with one.
d356_include_smd = true
# The net that a pad on no net has in that file: from 1 to 14 printable characters, no blank.
d356_unconnected_name = N/C
