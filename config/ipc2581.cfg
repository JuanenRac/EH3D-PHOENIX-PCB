# Settings of the IPC-2581 writer (`phoenix ipc2581`).
# Every line is optional; a missing line keeps the default shown here.

# The date and time of the history record of the file, as YYYY-MM-DDTHH:MM:SS. It is a setting
# and not the clock so that the same board always gives the same file; change it when the file
# should carry the date of the release.
origination = 1970-01-01T00:00:00

# Write the bill of materials: the parts grouped by value and footprint.
include_bom = true
# Write the tracks.
include_tracks = true
# Write the zones, as their outlines (the copper fill is not written).
include_zones = true
# Write the lines of the dimensions (extension lines, dimension lines, arrow heads and arcs) on a
# layer of the function DOCUMENT.
include_dimensions = true
# Write the texts of the dimensions (their measures) on that layer too. Without include_dimensions
# nothing of the dimensions is written.
include_dimension_texts = true
# The height of those texts, in nanometres; 0 keeps the height each dimension has. Between 0 and
# 1000000000.
dimension_text_height_nm = 0

# The most objects (parts, connected pads, tracks, vias and zones) that a board may hold for the
# file to be made. Between 1 and 100000000.
max_items = 1000000

# The IPC-D-356A netlist that `phoenix ipc2581 --d356 FILE` writes beside the IPC-2581 file. Write
# the pads without a hole (the surface pads) as well as the pads with one.
d356_include_smd = true
# The net that a pad on no net has in that file: from 1 to 14 printable characters, no blank.
d356_unconnected_name = N/C

# The reader (`phoenix ipc2581-read`). The files of other tools are not trusted: the largest file
# in bytes (1 to 2000000000), the deepest nesting of elements (4 to 1000), the most elements and
# the most items (holes, parts, nets, pads, tracks, regions) a file may hold (each 1 to
# 1000000000). A file over a limit is refused with a message that names the limit.
read_max_bytes = 134217728
read_max_depth = 64
read_max_elements = 50000000
read_max_items = 20000000
# Keep the geometry of the tracks, arcs, polylines and regions; the counts are always kept. Turn
# it off to count a very large file in little memory.
read_keep_geometry = true
# The most attributes on one element (1 to 10000) and the most findings listed for a file (1 to
# 100000; the rest are counted in one last finding).
read_max_attrs = 256
read_max_findings = 200
# The frequency in MHz (1 to 1000000) of the one point of a material that is made from a file for
# `--stackup-out`: the file gives a dielectric constant and a loss tangent but not the frequency.
read_reference_mhz = 1000

# A ZIP archive with an IPC-2581 file (`phoenix check --ipc2581 FILE.zip`, `phoenix ipc2581 --read
# FILE.zip`) is unpacked in memory only, never into a folder. The most bytes all its entries may
# hold unpacked (1 to 8000000000), the most entries it may list (1 to 100000) and the most an entry
# may grow as a multiple of its packed size (1 to 100000; a deflate stream cannot pass 1032). The
# largest single entry is `read_max_bytes`.
zip_max_total_bytes = 1073741824
zip_max_entries = 10000
zip_max_ratio = 1100
