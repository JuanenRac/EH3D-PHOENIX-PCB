# Settings of the heating of tracks and vias (`phoenix thermal`).
# Every line is optional; a missing line keeps the default shown here. An unknown key is an error.

# The temperature of the air, in degrees Celsius.
ambient_c = 25
# The resistivity of the copper at 20 degrees Celsius, in ohm metre, and its coefficient per kelvin
# (the values of EH3D-THERMAL-LAB).
resistivity_ohm_m = 1.724e-8
temp_coeff_per_k = 0.00393
# The convection coefficient of the top face and the edges of a track, in W/m2K. It is a choice of
# the person who runs the case, not a property of the board.
convection_w_m2k = 10
# The hottest at which the convection model is used, in degrees Celsius; a track that would pass it
# has no number from that model.
max_temperature_c = 125

# A track or a via whose rise is above this, in kelvin, is reported and the exit code is 1.
max_rise_k = 20
# Which estimate the limit is judged by: ipc2221, convection or larger (the larger of the two).
limit_basis = ipc2221

# The fit of IPC-2221, I = k * rise^0.44 * area^0.725 (ampere, kelvin, square mil), with k 0.048
# for an outer layer and 0.024 for an inner one. They are the constants usually printed with the
# chart; the standard has not been at hand to check them.
ipc_k_external = 0.048
ipc_k_internal = 0.024
ipc_exponent_rise = 0.44
ipc_exponent_area = 0.725
# The range of the chart as usually quoted; outside it the result carries a warning.
ipc_min_rise_k = 10
ipc_max_rise_k = 100
ipc_max_current_a = 35

# The thickness of the copper of a layer the stack-up does not give, in micrometres, and where a
# track lies when the stack-up does not say (internal is the careful choice: it heats more).
default_copper_um = 35
default_placement = internal
# The thickness of the plating of the barrel of a via, in micrometres.
via_plating_um = 25
# The most nets in a file of currents.
max_nets = 10000
