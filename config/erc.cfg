# Settings of the electrical rule check of the schematic (`phoenix erc ... --config`).
# Every line is optional; a missing line keeps the value shown here. This file is also the default
# that is built into the program, so what you read here is what runs when you give no file.

# How serious each rule is: off, info, warning or error. An error makes `phoenix erc` exit with 1.
# The rule pin_type_conflict is only a switch: off turns the matrix below off; any other value
# leaves the level of each pair of pin types to the matrix.
severity.pin_unconnected = error
severity.single_pin_net = warning
severity.pin_type_conflict = error
severity.input_without_driver = error
severity.power_without_source = error
severity.similar_net_names = warning
severity.duplicate_refdes = error
severity.empty_value = warning
severity.empty_refdes = error
severity.part_without_footprint = warning
severity.pin_without_number = error
severity.duplicate_pin_number = error
severity.floating_wires = warning
severity.junction_on_floating_wires = warning

# The matrix of pin types: what two pins on one net mean. The kinds are input, output,
# bidirectional, tri_state, passive, power_in, power_out, open_collector and not_connected. The
# levels are ok, info, warning and error. The matrix is symmetric (matrix.a.b is matrix.b.a) and a
# pair that is not listed is ok.
matrix.output.output = error
matrix.output.bidirectional = warning
matrix.output.tri_state = error
matrix.output.power_out = error
matrix.output.open_collector = error
matrix.bidirectional.power_out = warning
matrix.tri_state.power_out = error
matrix.tri_state.open_collector = warning
matrix.power_out.power_out = error
matrix.power_out.open_collector = error
matrix.input.not_connected = error
matrix.output.not_connected = error
matrix.bidirectional.not_connected = error
matrix.tri_state.not_connected = error
matrix.passive.not_connected = error
matrix.power_in.not_connected = error
matrix.power_out.not_connected = error
matrix.open_collector.not_connected = error

# The pin types that drive a signal (a net with input pins needs one of them), and the pin types
# that supply a power input (a net with power_in pins needs one of them).
drivers = output, bidirectional, tri_state, passive, power_out, open_collector
power_sources = power_out

# Two net names look alike when they differ only by case or by a number on the end (GND and GND1,
# VCC and Vcc). Names whose stem is shorter than this many characters are never compared, so the
# nets D0, D1 ... of a bus are not mistaken for each other.
similar_name_min_stem = 3

# The most findings listed; more than this are cut and the report says so.
max_findings = 10000
