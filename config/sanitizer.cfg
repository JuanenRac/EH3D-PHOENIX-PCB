# Settings of the library sanitizer (`phoenix sanitize ... --config`).
# Every line is optional; a missing line keeps the default shown here.

# The bounds of the walk and of the size of a library file (the same keys as the corpus inventory).
max_files = 200000
max_depth = 32
max_file_bytes = 268435456

# The bounds of the XML parser for one library file.
xml_max_depth = 256
xml_max_nodes = 20000000

# Coordinates are rounded to this grid before they are hashed, in nanometres (5000 = 5 micrometres).
round_nm = 5000
# Angles are rounded to this grid before they are hashed, in micro-degrees (1000000 = 1 degree).
angle_round_udeg = 1000000

# A shape turned by 90 degrees, mirrored in X, or shifted counts as the same shape. Off by default:
# a replacement that turns or shifts a part would change the board.
allow_rotation = false
allow_mirror = false
ignore_origin = false

# The lowest score, 0 to 100, at which two items are put in the same group (a group is only a
# proposal for the owner to confirm; nothing is merged).
threshold = 90

# The distance at which the position of a pad or a pin stops matching, the difference of size at
# which a pad stops matching, and the distance at which a point of a drawing stops matching (nm).
tolerance_position_nm = 200000
tolerance_size_nm = 100000
tolerance_outline_nm = 100000

# The distance between the points sampled on lines and arcs (nm), and the most points per item.
sample_step_nm = 100000
max_samples = 2000

# The weights of the parts of the score of a footprint and of a symbol.
weight_pads = 50
weight_outline = 25
weight_silk = 25
weight_symbol_pins = 50
weight_symbol_body = 50

# The layers whose lines are the outline and the silkscreen of a footprint.
outline_layers = 20, 39, 40, 41, 42
silk_layers = 21, 22, 51, 52

# The most pairs compared in one run (the comparison stops there and says so), and the most pads or
# pins an item may have to be compared by position.
max_pairs = 2000000
max_anchors = 512

# How the candidate to keep is chosen: richest (with a description, most used, most items) or first.
master_pick = richest

# How many times an output file is tried when another program holds it, and the wait between tries.
write_retries = 5
write_retry_ms = 50
