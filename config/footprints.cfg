# Dimensions for the footprint generators (`phoenix footprint <family> --param ...`), one value per
# family and variant, in millimetres unless a key says otherwise.
#
# STATUS: PROTOTYPE. The method is the one of IPC-7351B (Generic Requirements for Surface Mount
# Design and Land Pattern Standard): the land of a lead is the component lead dimensions plus a
# fillet goal at the toe, the heel and the side, with the tolerances of the component, of the
# fabrication and of the placement added in quadrature. The numbers below (component dimensions,
# tolerances and fillet goals) were entered by hand from the usual outline drawings of each
# package and have NOT been checked against the text of the standard or against the datasheet of
# any part. Before a board is made, compare every footprint with the datasheet of the part.
#
# Keys are `family.variant.name`; when a variant has no value for a name the value of
# `family.name` is used. Lines starting with # are comments.

meta.standard = IPC-7351B
meta.status = prototype, not verified against a datasheet

# Fabrication and placement tolerances of the method (F and P), and the grid, in millimetres, to
# which the size and the distance of the lands are rounded.
ipc.fab_tol = 0.05
ipc.place_tol = 0.025
ipc.round = 0.01

# Drawing: the width of the silkscreen, its distance from the copper, the length of the corner
# marks of the packages with leads on four sides, the radius of the dot that marks the first pin, the excess of the courtyard over the lands, the
# widths of the courtyard and of the assembly outline, and the text.
silk.width = 0.15
silk.gap = 0.20
silk.bracket = 1.00
silk.dot_r = 0.25
courtyard.excess = 0.25
courtyard.width = 0.05
assembly.width = 0.10
text.size = 1.00
text.gap = 0.30

