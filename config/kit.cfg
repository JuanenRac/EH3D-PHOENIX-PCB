# Settings of the command `phoenix kit` (`phoenix kit ... --config`).
# Every line is optional; a missing line keeps the default shown here.

# The largest catalogue (manifest.json) that is read, in bytes (1024 to 67108864).
max_manifest_bytes = 1048576
# The largest file of the kit that is copied, in bytes (1024 to 268435456).
max_file_bytes = 4194304
# The most pieces a catalogue may have (1 to 100000).
max_items = 1000
# Compare the SHA-256 of every file with the one in the catalogue before copying it. Leave it on:
# false copies files that were changed, for example while you work on a kit of your own.
verify_sha256 = true
# The folder of the kit when --kit is not given; empty means `kit` where the program runs, or
# `kit` next to the program.
kit_dir =
