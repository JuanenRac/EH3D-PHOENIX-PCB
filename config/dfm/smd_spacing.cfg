# The least distance between surface-mount parts by the type of their packages, as public
# guiding figures of a maker of assembly; a profile names a table with `smd_spacing = NAME`.
# The key is two classes joined by - (0201 0402 0603 0805 1206 qfn qfp sop sot bga) and the
# value is the least gap in nanometres (1 mm is 1000000), the same in both orders. A pair that
# is not listed is not checked. Every table says `verified = false` until someone compares it
# with the maker. The distance is measured between the boxes of the pads of the two parts.

[table jlcpcb]
verified = false
0201-0201 = 150000
0201-0402 = 150000
0201-0603 = 180000
0201-0805 = 180000
0201-1206 = 250000
