# EXAMPLE capability profile of a board maker, for `phoenix check --dfm FILE`.
#
# EXAMPLE, NOT VERIFIED. Every figure below is an invented round number that shows the form of the
# file; none of them is the capability of any real board maker. Copy this file, put the figures
# you read in the documentation of YOUR maker in the copy, write where you read them in `source`,
# and only then set verified = true. While verified is false the report says so (PHOENIX-DFM-006).
#
# Lengths are in nanometres (1 mm is 1000000). A line with 0 or a missing line is off.

name = example
source = invented figures, example only
verified = false

# The limits of the usual rule check (they replace the rules of the board for this run).
min_track_width_nm = 150000
min_clearance_nm = 150000
min_drill_nm = 300000
min_via_diameter_nm = 600000
min_annular_ring_nm = 150000
min_edge_clearance_nm = 300000
min_mask_bridge_nm = 100000
min_drill_spacing_nm = 250000
connect_tolerance_nm = 0
silkscreen_over_pads = true
silkscreen_over_mask_openings = false

# What the maker can build at all.
max_copper_layers = 4
min_board_short_nm = 10000000
min_board_long_nm = 10000000
max_board_short_nm = 400000000
max_board_long_nm = 500000000
max_drill_nm = 6300000
max_holes = 20000
