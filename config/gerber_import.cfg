# Settings of the import of Gerber and Excellon files (`phoenix gerber-import`).
# Every line is optional; a missing line keeps the default shown here.
# Lengths are in nanometres.

# The largest file that is read, in bytes, and the most files of one import.
max_file_bytes = 67108864
max_files = 64

# The most commands (blocks) of a Gerber file or lines of an Excellon file.
max_commands = 5000000

# The most apertures of a Gerber file, or tools of an Excellon file.
max_apertures = 4096

# The most drawn objects (flashes, lines, arcs, regions, holes) of one file.
max_objects = 2000000

# The most points of the regions of one file, arcs included.
max_region_points = 2000000

# The most primitives of one aperture macro, and the longest expression in it.
max_macro_primitives = 256
max_expression_chars = 256

# An arc inside a region is replaced by straight pieces that stay within arc_chord_nm of it, at
# most arc_max_segments of them. The two radii of an arc may differ by arc_radius_tolerance_nm.
arc_chord_nm = 5000
arc_max_segments = 4096
arc_radius_tolerance_nm = 5000

# The largest coordinate or size that is read (absolute value).
coordinate_limit_nm = 1073741824

# How far two positions may differ and still be the same in the comparison with a board.
compare_tolerance_nm = 1000

# An Excellon file that does not say which zeros it leaves out: leading or trailing.
excellon_omission = leading

# The digits before and after the point of an Excellon file that does not say.
excellon_inch_integer_digits = 2
excellon_inch_decimal_digits = 4
excellon_metric_integer_digits = 3
excellon_metric_decimal_digits = 3
