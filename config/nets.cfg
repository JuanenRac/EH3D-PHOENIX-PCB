# Settings of the text netlist (`phoenix nets`).
# Every line is optional; a missing line keeps the default shown here.

# The largest netlist file that is read, in bytes (from 1024 to 1073741824).
max_input_bytes = 16777216
# The most nets in a netlist (from 1 to 10000000).
max_nets = 100000
# The most pins on one net (from 1 to 10000000).
max_pins_per_net = 10000
# The most pins in a netlist (from 1 to 100000000).
max_pins = 1000000
# The longest name of a net, of a part or of a pad, in characters (from 1 to 1024).
max_name_len = 128
# The most differences that a comparison, or findings that the lint, list; the total is counted all the same (from 1 to 10000000).
max_differences = 1000

# Nets that a comparison leaves out on both sides and the lint does not look at, words separated by
# commas (any case); a name that ends in * matches every net that starts with the rest. Empty by
# default, so every net is compared.
ignore_nets =

# Whether a cell of a CSV file (`phoenix nets --csv`) that starts with =, +, -, @, a tab or a
# carriage return gets a single quote in front of it: a spreadsheet reads a cell such as +5V or
# -12V as a formula, and the quote stops that. true or false; true is the safe choice.
csv_guard_formulas = true

# The most pins a net may have before `phoenix nets --lint` reports it (PHOENIX-NETS-020); from 0 to 10000000, and 0 does not judge it.
lint_max_pins = 0

# Whether `phoenix nets --lint` reports the parts with two pins or more that are all on one net (PHOENIX-NETS-021), such as a resistor with both ends on GND. true or false; off by default.
lint_part_on_one_net = false

# Whether `phoenix nets --lint` reports the nets with a name that a program made when the designer gave none (N$12, Net-(R1-Pad1), unconnected-(U1-Pad3), $1N1234) (PHOENIX-NETS-022). true or false; off by default.
lint_generated_names = false

# Whether `phoenix nets --lint` reports the nets of two pins or more that all belong to one part (PHOENIX-NETS-023). true or false; off by default.
lint_one_part_nets = false

# Parts that a comparison and the lint leave out together with their pins, words separated by commas (any case; * stands for any run of characters, anywhere): the test points and fiducials that a board has and a schematic has not. A net that has no pin left because of them is left out too. Empty by default.
ignore_parts =
