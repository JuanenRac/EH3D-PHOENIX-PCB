# Settings of the RF tools (`phoenix rf ... --settings`).
# Every line is optional; a missing line keeps the default shown here.

# The most ports a Touchstone file may have.
max_ports = 16
# The most frequency points (and noise points) a Touchstone file may have.
max_points = 200000
# The largest Touchstone file that is read, in bytes.
max_file_bytes = 67108864
# The highest frequency accepted, in GHz.
max_frequency_ghz = 1000.0
# The highest filter order accepted (the Bessel tables stop at order 8 whatever this says).
max_filter_order = 12
# The smallest and the largest ripple of a Chebyshev filter, in dB.
min_ripple_db = 0.001
max_ripple_db = 6.0
# The smallest and the largest magnitude of an impedance given as input, in ohm.
min_impedance_ohm = 0.01
max_impedance_ohm = 1000000.0
# The most points of a frequency sweep.
max_sweep_points = 10000
# The step of the numerical group delay of a filter, as a fraction of the frequency.
delay_step_fraction = 0.0001
# Relative tolerance below which a reactance, a susceptance or a coefficient counts as zero.
tolerance = 1e-9
# A network whose largest singular value exceeds 1 by more than this is not passive.
passivity_tolerance = 1e-6
# The reference impedance used when none is given, in ohm.
default_z0_ohm = 50.0
