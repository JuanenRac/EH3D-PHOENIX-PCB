# Settings of the KiCad writers (`phoenix kicad-export ... --settings`).
# Every line is optional; a missing line keeps the default shown here. Lengths are in nanometres.

# The version numbers written in the files (the formats of KiCad 8).
pcb_version = 20240108
sch_version = 20231120
# The program name written in the files, and the library name put before the name of a
# footprint or a symbol (Library:Name).
generator = phoenix
lib_nickname = phoenix
# The paper written when a schematic has no sheet.
paper = A4
# The height and the stroke of the text of a reference, a value and a pin name.
text_size_nm = 1000000
text_thickness_nm = 150000
# The width of the lines of the board outline and of the body of a symbol.
edge_width_nm = 100000
symbol_line_nm = 254000
# The smallest width of the copper of a zone, and the pitch of the hatch on its outline.
zone_min_thickness_nm = 250000
zone_hatch_nm = 500000
# The distance between two parts that have no place in the drawing.
grid_nm = 25400000
# The length of a pin, the distance between two pins without a position, the margin of a body.
pin_length_nm = 2540000
pin_pitch_nm = 2540000
body_margin_nm = 1270000
# The most items of one kind that are written.
max_items = 2000000
