# Settings of the solder paste stencil (`phoenix stencil`, `phoenix fabpack`).
# Every line is optional; a missing line keeps the default shown here.
# Lengths are in millimetres.

# The thickness of the plate and the limits of IPC-7525: the aspect ratio (the smaller side of an
# opening over the thickness) and the area ratio (the area of the opening over the area of its
# walls) must be at least these values.
thickness_mm = 0.12
min_aspect = 1.5
min_area_ratio = 0.66

# The reduction of the openings: a per cent (`10%`: each side is that much shorter) or a length
# (`0.03mm`: each edge is that much inside the pad). `shrink` is for every footprint that no
# `reduce` line matches; `reduce = PATTERN VALUE` lines are tried in order against the name of the
# footprint (`*` for any run of characters, `?` for one, any case).
shrink = 0%
# reduce = QFN* 10%
# reduce = R0402 0.03mm

# A rectangular pad whose opening is larger than this area (square millimetres; 0 turns the
# splitting off) is divided in a grid of windows of at most window_max_mm with bridges of
# window_bridge_mm.
window_min_area_mm2 = 6
window_max_mm = 2
window_bridge_mm = 0.3

# The radius of the corners of the openings (0: square corners) and the pieces that draw one corner.
corner_radius_mm = 0
corner_segments = 4

# An opening with a side smaller than this after the reduction is taken away.
min_feature_mm = 0.05
