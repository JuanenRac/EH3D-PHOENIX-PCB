# Settings of the stack-up and transmission-line calculations (`phoenix stackup --settings`).
# Every line is optional; a missing line keeps the default shown here.

# Conductivity of the copper in S/m (100 % IACS is 5.8e7; electrodeposited foil is a little lower).
copper_conductivity_s_per_m = 5.8e7
# A conductor thinner than this many skin depths raises a warning.
thin_conductor_skin_depths = 3.0
# A substrate height above this fraction of the guided wavelength raises a quasi-static warning.
quasi_static_height_fraction = 0.05
# The highest frequency accepted, in GHz.
max_frequency_ghz = 1000.0
# The synthesis of a track width stops when the impedance is this close to the target, in ohm.
synth_tolerance_ohm = 0.01
# The most steps the synthesis takes.
synth_max_iterations = 100
# The narrowest and the widest track the synthesis tries, in nanometres.
synth_min_width_nm = 50000
synth_max_width_nm = 20000000
