# Settings of the own corpus (`phoenix corpus ... --settings`).
# Every line is optional; a missing line keeps the default shown here.

# The largest corpus file that is read, in bytes.
max_file_bytes = 8388608
# The most expectation files of one corpus, and the deepest nesting of folders the walk enters.
max_entries = 2000
max_depth = 8
# How far two positions may differ in a round trip, in nanometres, when the expectation does not say.
round_trip_tolerance_nm = 10
# How many seeds each property is tried with, and the first seed (the others follow one by one).
property_seeds = 48
property_first_seed = 1
# The largest generated board (components) and the most changes tried on it.
property_max_components = 5
property_max_steps = 12
