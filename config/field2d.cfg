# Settings of the two-dimensional field solver (`phoenix field2d`).
# Every line is optional; a missing line keeps the default shown here. An unknown key is an error.

# The method that solves the Laplace equation: cg (conjugate gradients with a diagonal
# preconditioner) or sor (successive over-relaxation).
method = cg
# The solver stops when the residual is this fraction of the first residual.
tolerance = 1e-10
# The most iterations of one solution; a solution that has not reached the tolerance by then is
# an error and gives no number.
max_iterations = 50000
# The most cells of the mesh; a section that would need more is refused.
max_cells = 400000
# The factor of over-relaxation of the method sor (at least 1, below 2).
sor_omega = 1.9

# The size of a cell at the edge of a conductor, as a fraction of the smallest feature of the
# section (a thickness, a width, a gap or the height of a layer).
edge_step_fraction = 0.25
# The largest cell, as a fraction of the smaller side of the box.
max_step_fraction = 0.1
# How much a cell may be larger than the one before it when the mesh grows away from an edge.
grading_ratio = 1.25
# Every step of the mesh is divided by this number. A convergence study raises it.
refine = 1.0
# The distance from the tracks to the walls of the box, as a multiple of the sum of the height
# of the section and the width the conductors take. The walls are at zero potential.
box_margin_factor = 8.0

# The frequency, in GHz, at which the permittivity and the loss tangent of the materials are taken
# when the command does not give one.
freq_ghz = 1.0
# A difference from the closed formula above this percentage is a warning.
compare_warn_percent = 5.0
# The most lines one run solves.
max_cases = 200
