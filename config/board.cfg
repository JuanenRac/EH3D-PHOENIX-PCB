# Limits of the checks of a board (`Board::validate_with`).
# Every line is optional; a missing line keeps the default shown here.

# The most points of a polygon (outline, cutout or zone) whose edges are tested for crossing each
# other. The test takes time with the square of the number of points; a polygon with more points
# is not tested and PHOENIX-BOARD-010 says so. From 3 to 1000000.
max_polygon_points = 10000
