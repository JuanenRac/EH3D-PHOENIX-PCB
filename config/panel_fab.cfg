# Rules of a board maker for a panel (`phoenix panel --fab-rules NAME`).
# Lines `key = value` before the first section are for the whole file; each section
# `[rules NAME]` is one set of figures. A figure of 0 is not checked. Lengths are in nanometres
# (1 mm is 1000000). Every set is marked `verified = false`: the figures are public guiding
# numbers of the makers, compared with nobody; check them with the maker before a panel is made.

# The panel goes to assembly: the tooling edge is the wider one and tooling holes are asked for.
smt_assembly = false
# The thickness of the board. The board file does not give it, and a V-cut needs a least one.
board_thickness_nm = 1600000

# A middle set made of the figures that the makers have in common.
[rules common]
verified = false
# V-cut: the angle of the groove, the least copper-to-cut distance, the least thickness of the
# board, the least panel (on both sides) and the least distance between two parallel cuts.
v_cut_angle_deg = 25
v_cut_copper_min_nm = 400000
v_cut_thickness_min_nm = 600000
v_cut_panel_min_nm = 60000000
v_cut_line_gap_min_nm = 2000000
# Routed tabs: the least gap, the diameter and the distance between the edges of the holes that
# break the tab, how many there are in a tab, and the least tab.
route_gap_min_nm = 1600000
stamp_hole_min_nm = 450000
stamp_spacing_min_nm = 350000
stamp_holes_min = 5
stamp_holes_max = 6
tab_min_nm = 2000000
# Fiducials: how many, the copper diameter and the least solder mask opening.
fiducial_count_min = 3
fiducial_diameter_nm = 1000000
fiducial_mask_nm = 1700000
# The tooling edge (wider for assembly) and the tooling holes.
tool_edge_nm = 3000000
tool_edge_smt_nm = 5000000
tool_hole_diameter_nm = 2000000

[rules jlcpcb]
verified = false
v_cut_angle_deg = 25
v_cut_copper_min_nm = 400000
v_cut_thickness_min_nm = 600000
v_cut_panel_min_nm = 70000000
v_cut_line_gap_min_nm = 2000000
route_gap_min_nm = 1600000
stamp_hole_min_nm = 500000
stamp_hole_max_nm = 800000
stamp_spacing_min_nm = 200000
tab_min_nm = 4000000
tab_min_stamped_nm = 5000000
fiducial_diameter_nm = 1000000
tool_edge_nm = 3000000
tool_edge_smt_nm = 5000000
tool_hole_diameter_nm = 2000000

[rules pcbway]
verified = false
v_cut_copper_min_nm = 400000
v_cut_thickness_min_nm = 600000
v_cut_panel_min_nm = 60000000
route_gap_min_nm = 1600000
stamp_hole_min_nm = 450000
stamp_spacing_min_nm = 350000
stamp_holes_min = 5
stamp_holes_max = 6
tab_min_nm = 2000000
fiducial_count_min = 3
fiducial_diameter_nm = 1000000
fiducial_mask_nm = 1700000
tool_edge_nm = 5000000
tool_edge_smt_nm = 5000000
