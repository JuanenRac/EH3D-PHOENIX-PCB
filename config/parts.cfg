# Limits of the local parts base (`phoenix parts ... --config`, `phoenix bom --parts-db`).
# Every line is optional; a missing line keeps the default shown here. The base is made of files
# of the user (JSON `phoenix-parts/1` and CSV); nothing is ever fetched from a network.

# The most files read from a folder of the base.
max_files = 200
# The largest file, in bytes (16 MiB).
max_file_bytes = 16777216
# The most parts in the whole base.
max_parts = 200000
# The most offers (suppliers) of one part, and the most price breaks of one offer.
max_offers_per_part = 50
max_tiers_per_offer = 50
# The most results that a search prints.
max_results = 1000
