# Settings of the lengths and pairs (`phoenix lengths`).
# Every line is optional; a missing line keeps the default shown here.

# The delay of a track on a layer that has none of its own and none from the stack-up, in
# picoseconds per millimetre.
default_delay_ps_per_mm = 6.0
# The delay of a via barrel, in picoseconds per millimetre.
via_delay_ps_per_mm = 6.9
# The length of a via when the stack-up does not give it, in nanometres.
default_via_length_nm = 1600000

# The delay of a single layer, by the name of the layer, in picoseconds per millimetre. It wins
# over the stack-up. Example (leave commented out unless a layer needs it):
# layer_delay_ps_per_mm.F.Cu = 5.9

# Take the delay of a layer from the stack-up when one is given with --stackup (true or false).
use_stackup = true
# The frequency the delay of the stack-up is worked out at, in GHz.
stackup_frequency_ghz = 1.0

# Lengths are in nanometres from here on.
# The tolerance of a group, and the length difference of a pair, that give none.
default_group_tolerance_nm = 500000
# The widest gap at which two tracks of a pair still count as coupled.
pair_coupling_range_nm = 1000000
# How far the gap and the width of a pair may be from the ones asked for, when it gives none.
pair_gap_tolerance_nm = 50000
pair_width_tolerance_nm = 10000
# The most tracks and vias, and groups and pairs, a report handles.
max_items = 100000
