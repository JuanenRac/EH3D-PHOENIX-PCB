# Settings of the advanced design rule checks (`phoenix check --advanced`, `--drc-config FILE`, and the
# board editor when `advanced_drc = true` in boardedit.cfg). This file is also the default that is
# built into the program. A line that is left out keeps the value shown here; a key the program does
# not know, a key written twice and a value out of range are refused.
#
# Every check has a level: off, info, warning or error. Only an error makes the check fail. The values
# below are examples for a small prototype board, not the rules of any manufacturer: take the limits
# from the manufacturer that makes the board.

# The size of a cell of the uniform grid that makes the search for neighbours fast, in nanometres. It
# changes the speed only, never the result.
grid_cell_nm = 2000000

# Thinnest annular ring of a via (pad against drill) and of a drilled pad (smallest side against
# drill), in nanometres.
annular_ring_level = error
annular_ring_min_nm = 150000

# Copper (tracks and vias) and pads against the edge of the board, in nanometres.
copper_edge_level = error
copper_edge_min_nm = 300000
pad_edge_level = warning
pad_edge_min_nm = 250000

# Smallest drill of vias and drilled pads, in nanometres: the default for every net and, for the net
# classes written below, a value of their own. A class holds the names of its nets (separated by
# commas). Write as many classes as needed:
#   drill_class.power.nets = VIN,VBUS
#   drill_class.power.min_nm = 400000
drill_class_level = warning
drill_default_min_nm = 200000

# Silkscreen against the drill of a through hole (pads and vias), in nanometres.
silk_hole_level = warning
silk_hole_min_nm = 150000

# A neck: a track narrower than this width, in nanometres, that joins wider copper of its net (a
# pad, a via or a wider track) at one of its ends.
neck_level = warning
neck_min_width_nm = 200000

# An acid trap: two pieces of tracks of one net that meet at an angle smaller than this, in degrees.
acid_trap_level = warning
acid_trap_min_angle_deg = 90

# Spacing between copper of different nets by the voltage between them. The voltage of a net is
# written by its name, in volts; a net that is not written is not judged (write the ground net as 0).
#   voltage.VIN = 48
#   voltage.GND = 0
# The table is Table 6-1 of IPC-2221 (Electrical Conductor Spacing), copied from memory and NOT
# VERIFIED AGAINST THE STANDARD: check every figure against your copy of the standard before you rely
# on it. Each row is: the highest voltage of the row (volts), then the spacing in nanometres for the
# columns B1, B2, B3, B4, A5, A6 and A7. B1: internal conductors; B2: external conductors, uncoated,
# sea level to 3050 m; B3: external conductors, uncoated, above 3050 m; B4: external conductors with
# permanent polymer coating, any height; A5: external conductors with conformal coating over the
# assembly; A6: external component lead or termination, uncoated; A7: external component lead or
# termination with conformal coating. Above the last row the spacing is the figure per volt below
# times the voltage. Writing iso_row lines replaces the whole table.
isolation_level = error
iso_column = b2
iso_row = 15 50000 100000 100000 50000 130000 130000 130000
iso_row = 30 50000 100000 100000 50000 130000 250000 130000
iso_row = 50 100000 600000 600000 130000 130000 400000 130000
iso_row = 100 100000 600000 1500000 130000 130000 500000 130000
iso_row = 150 200000 600000 3200000 400000 400000 800000 400000
iso_row = 170 200000 1250000 3200000 400000 400000 800000 400000
iso_row = 250 200000 1250000 6400000 400000 400000 800000 400000
iso_row = 300 200000 1250000 12500000 400000 400000 800000 800000
iso_row = 500 250000 2500000 12500000 800000 800000 1500000 800000
iso_per_volt_nm = 2500 5000 25000 3050 3050 3050 3050

# Copper that joins no pad (an island of a net with tracks, vias or zones only), and a stub: a track
# with one end that touches nothing of its net while its other end is joined.
island_level = warning
stub_level = warning

# Vias on the same place (or at most this far apart, in nanometres) that share a layer.
via_duplicate_level = error
via_duplicate_max_distance_nm = 0

# A pad that is on no net, and a component with a pad outside the outline of the board.
pad_no_net_level = warning
outside_outline_level = error
