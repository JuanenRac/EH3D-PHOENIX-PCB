[package]
name = "eh3d-phoenix-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Script interpreter for the command language of the old workflow (built from the public description of the language): a parser for script files, reversible all-or-nothing execution on a board, a compatibility report per script and a reader of output jobs into an export profile"

[dependencies]
eh3d-phoenix-board = { path = "../eh3d-phoenix-board" }
eh3d-phoenix-erc = { path = "../eh3d-phoenix-erc" }
eh3d-phoenix-export = { path = "../eh3d-phoenix-export" }
eh3d-phoenix-model = { path = "../eh3d-phoenix-model" }
eh3d-phoenix-route = { path = "../eh3d-phoenix-route" }
eh3d-phoenix-rules = { path = "../eh3d-phoenix-rules" }
eh3d-phoenix-schematic = { path = "../eh3d-phoenix-schematic" }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
