[package]
name = "eh3d-phoenix-panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Panelization of boards (prototype): a matrix of one board or a list of different boards packed by rows, turned and mirrored, with a gap, a frame, tabs with mouse bite holes or V-score lines, fiducials and tooling holes, all taken from a settings file, with the outline, the V-score lines, and the copper, solder mask, paste, legend and drill files of every copy written through the export of the suite"

