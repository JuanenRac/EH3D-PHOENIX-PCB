[package]
name = "eh3d-phoenix-stackup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Board stack-up and transmission-line calculations: layers with copper in ounces or micrometres, Dk and Df interpolated between published points, impedance and effective permittivity of microstrip, stripline, coplanar waveguide and coupled pairs, conductor and dielectric loss, delay, and synthesis of a track width"

[features]
# An adapter from the materials database of EH3D-COMMON (`src/materials_adapter.rs`): a material
# of the database becomes a `MaterialSample`. It is off by default in this crate; the command line
# switches it on.
materials = ["dep:eh3d-materials"]

[dependencies]
eh3d-materials = { workspace = true, optional = true }
eh3d-diagnostic.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
