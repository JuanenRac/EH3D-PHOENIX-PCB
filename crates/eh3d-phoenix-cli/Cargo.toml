[package]
name = "eh3d-phoenix-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line of EH3D-PHOENIX-PCB"
build = "build.rs"

[lib]
name = "eh3d_phoenix_cli"
path = "src/lib.rs"

[[bin]]
name = "phoenix"
path = "src/main.rs"

# the window as a program of its own: it opens with the start screen and, on Windows, without the
# black console window that the command line keeps
[[bin]]
name = "phoenix-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
default = ["materials"]
# the materials database of EH3D-COMMON: `phoenix materials` and `phoenix stackup --material`;
# `--no-default-features` builds without it
materials = ["eh3d-phoenix-stackup/materials", "dep:eh3d-materials"]
# the window of the viewer: `cargo run --release -p eh3d-phoenix-cli --features gui --bin phoenix-gui`
# (or `phoenix view <file>`)
gui = ["eh3d-phoenix-viewer/gui"]

[dependencies]
eh3d-phoenix-assembly3d = { path = "../eh3d-phoenix-assembly3d" }
eh3d-phoenix-autoroute = { path = "../eh3d-phoenix-autoroute" }
eh3d-phoenix-board = { path = "../eh3d-phoenix-board" }
eh3d-phoenix-boardedit = { path = "../eh3d-phoenix-boardedit" }
eh3d-phoenix-bom = { path = "../eh3d-phoenix-bom" }
eh3d-phoenix-corpus = { path = "../eh3d-phoenix-corpus" }
eh3d-phoenix-dxf = { path = "../eh3d-phoenix-dxf" }
eh3d-phoenix-eagle = { path = "../eh3d-phoenix-eagle" }
eh3d-phoenix-eagle-board = { path = "../eh3d-phoenix-eagle-board" }
eh3d-phoenix-eagle-deep = { path = "../eh3d-phoenix-eagle-deep" }
eh3d-phoenix-erc = { path = "../eh3d-phoenix-erc" }
eh3d-phoenix-export = { path = "../eh3d-phoenix-export" }
eh3d-phoenix-field2d = { path = "../eh3d-phoenix-field2d" }
eh3d-phoenix-gerber = { path = "../eh3d-phoenix-gerber" }
eh3d-phoenix-ipclib = { path = "../eh3d-phoenix-ipclib" }
eh3d-phoenix-kicad = { path = "../eh3d-phoenix-kicad" }
eh3d-phoenix-lengths = { path = "../eh3d-phoenix-lengths" }
eh3d-phoenix-libedit = { path = "../eh3d-phoenix-libedit" }
eh3d-phoenix-model = { path = "../eh3d-phoenix-model" }
eh3d-phoenix-oracle = { path = "../eh3d-phoenix-oracle" }
eh3d-phoenix-panel = { path = "../eh3d-phoenix-panel" }
eh3d-phoenix-print = { path = "../eh3d-phoenix-print" }
eh3d-phoenix-parts = { path = "../eh3d-phoenix-parts" }
eh3d-phoenix-rf = { path = "../eh3d-phoenix-rf" }
eh3d-phoenix-rfgen = { path = "../eh3d-phoenix-rfgen" }
eh3d-phoenix-route = { path = "../eh3d-phoenix-route" }
eh3d-phoenix-rules = { path = "../eh3d-phoenix-rules" }
eh3d-phoenix-spatial = { path = "../eh3d-phoenix-spatial" }
eh3d-phoenix-sanitizer = { path = "../eh3d-phoenix-sanitizer" }
eh3d-phoenix-schedit = { path = "../eh3d-phoenix-schedit" }
eh3d-phoenix-schematic = { path = "../eh3d-phoenix-schematic" }
eh3d-phoenix-script = { path = "../eh3d-phoenix-script" }
eh3d-phoenix-si = { path = "../eh3d-phoenix-si" }
eh3d-phoenix-sim = { path = "../eh3d-phoenix-sim" }
eh3d-phoenix-stackup = { path = "../eh3d-phoenix-stackup" }
eh3d-phoenix-sync = { path = "../eh3d-phoenix-sync" }
eh3d-phoenix-viewer = { path = "../eh3d-phoenix-viewer" }
eh3d-phoenix-zones = { path = "../eh3d-phoenix-zones" }
serde_json.workspace = true
eh3d-materials = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
