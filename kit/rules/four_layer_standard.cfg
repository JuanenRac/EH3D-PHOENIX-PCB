# EH3D-PHOENIX-PCB starter kit. SPDX-License-Identifier: GPL-3.0-or-later
# Four layers, comfortable figures.
# Generic round figures chosen for this kit as a starting point: they are not the sheet of any
# board maker and nothing was verified, so the report says so (PHOENIX-DFM-006). Copy the file,
# put the figures of your maker, write where you read them and only then set verified = true.
# Lengths are in nanometres (1 mm is 1000000).

name = four_layer_standard
source = generic starting figures of the kit, no maker
verified = false

min_track_width_nm = 125000
min_clearance_nm = 125000
min_drill_nm = 250000
min_via_diameter_nm = 500000
min_annular_ring_nm = 125000
min_edge_clearance_nm = 300000
min_mask_bridge_nm = 0
min_drill_spacing_nm = 250000
max_copper_layers = 4
min_board_short_nm = 5000000
min_board_long_nm = 5000000
max_board_short_nm = 200000000
max_board_long_nm = 300000000
max_drill_nm = 6000000
